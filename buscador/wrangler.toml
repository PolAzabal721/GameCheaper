name = "pillao-buscador"
main = "index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[kv_namespaces]]
binding = "PILLAO"
id = "__KV_ID__"

[[d1_databases]]
binding = "DB"
database_name = "pillao-contador"
database_id = "__D1_ID__"

# Cada hora se revisan los avisos de precio por email
[triggers]
crons = ["41 * * * *"]
