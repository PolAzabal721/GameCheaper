<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>It Takes Two</title></head><body>
<script src="kit.js"></script>
<script>
const DUR=35.8;
const PALETA={cielo:"linear-gradient(180deg,#140726,#2a0f4d 45%,#5a1f7a 80%,#7a2a86)",shader:["#120624","#2a0f4d","#5a1f7a","#3a1a78","#7a2a86"],acento:"#ff9ad5"};
const IMAGENES=["img/ittakestwo.jpg"];
const FRASES=[
 [0.2,3.6,"¿Sabías que *It Takes Two* no se puede jugar *solo?*"],
 [3.7,7.8,"Es un juego *cooperativo:* hacen falta *dos* jugadores sí o sí."],
 [7.9,12.2,"Pero tu colega dice que no lo tiene… y que no piensa gastarse *40* euros."],
 [12.3,16.8,"Tranquilo: con el *Pase de amigo,* solo uno de los dos lo tiene que *comprar.*"],
 [16.9,21.6,"Y hoy, en PS Store, cuesta *7,99* euros para PS5."],
 [21.7,26.4,"7,99 entre dos jugadores… sale a menos de *4* euros por *cabeza.*"],
 [26.5,30.6,"Es su precio más *bajo* desde que Pillao lo sigue. Ya no hay *excusa.*"],
 [30.7,35.2,"Así que busca a tu *dúo* y compara en *pillaojuegos.com*"],
];
document.getElementById("estrellas").innerHTML=estrellas();
const P1=(tp,b=0)=>persona(tp,"#f0b98a","#3b82c4","#2b1a0e",0,mando(150,330+b));
const P2=(tp,b=0,m=true)=>persona(tp,"#e8b08a","#d9534f","#6b3b1f",3,m?mando(150,330-b):"");
function dos(lt,p1,p2,extraI="",extraD="",mando2=true){const b=Math.sin(lt*8)*4;
 return calle()+luna(880,560)+caseta({x:40,y:860,w:480,col:"#a5512a",pais:"JUGADOR 1",persona:P1(p1,b),extra:extraI})+
  caseta({x:560,y:860,w:480,col:"#1f6e5a",pais:"JUGADOR 2",persona:P2(p2,b,mando2),extra:extraD,luz:"#ff9ad5"})}
function bocadillo(txt,x,y,k){return `<div style="position:absolute;left:${x}px;top:${y}px;white-space:nowrap;padding:20px 26px;border-radius:26px;background:#fff;color:#1a0b33;font:800 38px 'Inter';transform:scale(${eb(k)});transform-origin:20% 100%;box-shadow:0 14px 30px rgba(0,0,0,.35)">${txt}<div style="position:absolute;left:50px;bottom:-22px;width:0;height:0;border:14px solid transparent;border-top:18px solid #fff"></div></div>`}
function escena(t){let h="";
 if(t<3.7){ const lt=t; h+=calle()+luna(880,560)+caseta({x:40,y:860,w:480,col:"#a5512a",pais:"JUGADOR 1",persona:P1(lt>1.4?"sorpresa":"normal")});
  h+=caseta({x:560,y:860,w:480,col:"#555",pais:"JUGADOR 2",fondo:"#1c1230",luz:"#000000",extra:`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 140px 'Inter Display';color:rgba(255,255,255,.18)">?</div>`});
  if(lt>1.8) h+=sello("SOLO NO",120,1560,sg(lt,1.8,2.2));
 } else if(t<7.9){ const lt=t-3.7; h+=dos(lt,"feliz",lt>.8?"feliz":"normal");
  const k=eo(sg(lt,.6,1.6)); h+=`<svg style="position:absolute;left:0;top:0" width="1080" height="1920"><path d="M410 1450 Q540 ${1560+Math.sin(lt*4)*20} 670 1450" stroke="#ff9ad5" stroke-width="10" fill="none" stroke-dasharray="${k*400} 400" stroke-linecap="round"/></svg>`;
  if(lt>1.6) h+=`<div style="position:absolute;left:500px;top:${1500+Math.sin(lt*5)*8}px;font-size:80px;transform:scale(${eb(sg(lt,1.6,2))})">❤️</div>`;
  if(lt>2.4) h+=`<div class="dato" style="left:400px;top:700px;opacity:${sg(lt,2.4,2.7)}">2<small>jugadores</small></div>`;
 } else if(t<12.3){ const lt=t-7.9; h+=dos(lt,"normal",lt>1?"sorpresa":"normal","","",false);
  h+=bocadillo("¿40 €? Ni de broma.",520,620,sg(lt,.8,1.2));
  if(lt>2.4) h+=`<div style="position:absolute;left:70px;top:700px">${bocadillo("Venga, porfa…",0,0,sg(lt,2.4,2.8))}</div>`;
 } else if(t<16.9){ const lt=t-12.3; h+=dos(lt,"feliz",lt>2.6?"feliz":"sorpresa","","",lt>2.6);
  const k=eio(sg(lt,1.0,2.4)); const x=180+k*560, y=1000-Math.sin(k*Math.PI)*300;
  h+=`<div style="position:absolute;left:${x}px;top:${y}px;width:230px;padding:16px;border-radius:14px;background:#ffd36a;color:#1a0b33;font:900 32px 'Inter Display';text-align:center;transform:rotate(${-10+k*20}deg);box-shadow:0 14px 30px rgba(0,0,0,.4);opacity:${lt<.9?sg(lt,.4,.9):1}">🎟️ PASE<br>DE AMIGO</div>`;
  h+=`<div class="dato" style="left:110px;top:1560px;opacity:${sg(lt,.2,.5)}">COMPRA</div>`;
  if(lt>2.8) h+=`<div class="dato" style="left:640px;top:1560px;background:#d8ff1f;color:#1a0b33;opacity:${sg(lt,2.8,3.1)}">GRATIS</div>`;
 } else if(t<21.7){ const lt=t-16.9; h+=calle()+luna(120,560)+portada("img/ittakestwo.jpg",330,620,420,-3,"#ff9ad5");
  if(lt>.8) h+=`<div style="position:absolute;left:0;right:0;top:1330px;text-align:center">${etiq(contador(lt,.8,2.6,39.99,7.99),.6+.4*Math.sin(t*6))}</div>`;
  if(lt>2.8) h+=`<div class="dato" style="left:690px;top:600px;font-size:36px;transform:rotate(6deg)">PS5 · PS STORE</div>`;
 } else if(t<26.5){ const lt=t-21.7; h+=dos(lt,"feliz","feliz"); const k=eo(sg(lt,1.0,2.0));
  h+=`<div style="position:absolute;left:0;right:0;top:700px;text-align:center;opacity:${1-sg(lt,1.8,2.2)}">${etiq("7,99 €")}</div>`;
  h+=`<div style="position:absolute;left:${390-k*240}px;top:${700+k*60}px;opacity:${sg(lt,1.8,2.2)}">${etiq("4,00 €",.5)}</div>`;
  h+=`<div style="position:absolute;left:${390+k*230}px;top:${700+k*60}px;opacity:${sg(lt,1.8,2.2)}">${etiq("3,99 €",.5,"#ff9ad5")}</div>`;
 } else if(t<30.7){ const lt=t-26.5; h+=calle()+luna(880,560)+portada("img/ittakestwo.jpg",130,680,340,-5,"#ff9ad5");
  h+=sello("MÍNIMO",150,1260,sg(lt,.6,1.0),"#d8ff1f");
  h+=caseta({x:560,y:860,w:440,col:"#1f6e5a",pais:"JUGADOR 2",persona:P2("feliz",Math.sin(lt*8)*4),luz:"#ff9ad5"});
  if(lt>2.2) h+=bocadillo("Vale, me apunto 😅",560,640,sg(lt,2.2,2.6));
 } else { const lt=t-30.7; h+=cierre(lt,"#ff9ad5")+`<div style="position:absolute;left:0;right:0;top:1060px;text-align:center;transform:scale(${eb(sg(lt,.9,1.3))})">${etiq("7,99 €",.7)}</div>`; }
 return h}
iniciar();
</script></body></html>
