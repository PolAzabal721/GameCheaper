<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gta6barberias</title></head><body>
<script src="kit.js"></script>
<script src="historia.js"></script>
<script>
// GTA 6: las 3 mejores barberías y qué peinados hay en cada una. Dibujos genéricos propios (nada de personajes ni logos del juego).
const PALETA={cielo:"linear-gradient(180deg,#12082a,#3b1460 40%,#a0307e 78%,#ff7a5c)",shader:["#12082a","#3b1460","#a0307e","#ff7a5c","#0d3b4f"],acento:"#ff4fa3",suelo:"#140f28"};
const JUEGO={titulo:"Grand Theft Auto VI",tituloCaja:"GRAND THEFT<br>AUTO VI",titCaja:.1,tiendaNombre:"CJS CD Keys",precio:64.82,pvp:76.84,plat:"PS5",clave:"Clave PSN"};
const num=(n,k)=>`<div style="position:absolute;left:60px;top:${430-(1-eb(cl(k)))*80}px;width:190px;height:190px;border-radius:50%;background:#d8ff1f;color:#140f28;display:grid;place-items:center;font:900 130px 'Inter Display';letter-spacing:-.06em;opacity:${cl(k*3)};box-shadow:0 0 50px #d8ff1f88">${n}</div>`;
const neon=(txt,x,y,col,k=1,tam=70)=>`<div style="position:absolute;left:${x}px;top:${y}px;padding:14px 26px;border:5px solid ${col};border-radius:16px;font:900 ${tam}px 'Inter Display';color:#fff;letter-spacing:-.02em;white-space:nowrap;opacity:${cl(k*2)};text-shadow:0 0 18px ${col},0 0 40px ${col};box-shadow:0 0 30px ${col}aa,inset 0 0 20px ${col}66">${txt}</div>`;
const poste=(x,y,lt)=>`<div style="position:absolute;left:${x}px;top:${y}px;width:60px;height:260px;border-radius:30px;border:6px solid #e8e4f0;background:repeating-linear-gradient(-45deg,#e94a63 0 22px,#fff 22px 44px,#3a7bd5 44px 66px,#fff 66px 88px);background-position:0 ${lt*120}px"></div>`;
const local=(lt,nombre,col,pared="#2a1a44")=>P.edificios("#1d1533","#ffd36a",3,1)+P.suelo("#140f28")+`<div style="position:absolute;left:120px;top:880px;width:840px;height:620px;background:${pared};border-radius:12px 12px 0 0;box-shadow:0 0 0 6px #140f28"><div style="position:absolute;left:60px;top:220px;width:420px;height:300px;background:linear-gradient(#ffd98a55,#ff9ad033);border:8px solid #140f28"></div><div style="position:absolute;right:70px;top:240px;width:200px;height:380px;background:#140f28;border-radius:8px 8px 0 0"></div></div>`+poste(70,1180,lt)+neon(nombre,0,700,col,sg(lt,.2,.6),76).replace("left:0px","left:50%;transform:translateX(-50%)");
// Cabeza vista de espaldas con dibujo rapado
function nuca(x,y,s,patron,lt=0){const c={
 llamas:`<path d="M-120 60 q20 -60 40 -20 q10 -80 40 -40 q20 -90 40 -30 q20 -70 40 0 q30 -60 40 30 v120 h-200z" fill="#ff7a1a"/><path d="M-100 80 q20 -40 30 -10 q20 -60 40 -10 q20 -50 40 0 q20 -40 30 20 v100 h-140z" fill="#ffd34f"/>`,
 flores:[[-60,-30,"#a45cff"],[40,-60,"#ff7ab6"],[60,40,"#a45cff"],[-50,60,"#ff7ab6"]].map(([fx,fy,co])=>[0,72,144,216,288].map(a=>`<ellipse cx="${fx+Math.cos(a*Math.PI/180)*22}" cy="${fy+Math.sin(a*Math.PI/180)*22}" rx="18" ry="12" fill="${co}" transform="rotate(${a} ${fx+Math.cos(a*Math.PI/180)*22} ${fy+Math.sin(a*Math.PI/180)*22})"/>`).join("")+`<circle cx="${fx}" cy="${fy}" r="12" fill="#ffd34f"/>`).join(""),
 telarana:`<g stroke="#d8ff1f" stroke-width="6" fill="none">${[0,30,60,90,120,150].map(a=>`<line x1="${Math.cos(a*Math.PI/180)*-170}" y1="${Math.sin(a*Math.PI/180)*-170}" x2="${Math.cos(a*Math.PI/180)*170}" y2="${Math.sin(a*Math.PI/180)*170}"/>`).join("")}${[40,80,120].map(r=>`<circle r="${r}"/>`).join("")}</g>`,
 tigre:[...Array(7)].map((_,i)=>`<path d="M-160 ${-110+i*36} q60 ${i%2?-20:20} 80 0 q-10 14 -80 12z M160 ${-100+i*36} q-60 ${i%2?20:-20} -80 0 q10 14 80 12z" fill="#140f28"/>`).join(""),
 leopardo:[...Array(22)].map((_,i)=>{const px=(rnd(i)-.5)*260,py=(rnd(i+40)-.5)*260;return `<circle cx="${px}" cy="${py}" r="${14+rnd(i+9)*8}" fill="none" stroke="#4a2a10" stroke-width="7"/><circle cx="${px}" cy="${py}" r="9" fill="#c98a2a"/>`}).join(""),
}[patron]||"";const fondo={tigre:"#ff9a3a",leopardo:"#f2d58a",telarana:"#3aa65a",llamas:"#e9d6c0",flores:"#e9d6c0"}[patron]||"#e9d6c0";
 return `<svg style="position:absolute;left:${x-220*s}px;top:${y-260*s}px;overflow:visible" width="${440*s}" height="${560*s}" viewBox="-220 -260 440 560"><defs><clipPath id="cl${patron}"><ellipse cx="0" cy="-20" rx="170" ry="190"/></clipPath></defs>
 <path d="M-210 300 q10 -130 210 -140 q200 10 210 140z" fill="#6b1f3a"/><rect x="-60" y="120" width="120" height="80" fill="#c98a5e"/><ellipse cx="-172" cy="10" rx="24" ry="40" fill="#c98a5e"/><ellipse cx="172" cy="10" rx="24" ry="40" fill="#c98a5e"/>
 <ellipse cx="0" cy="-20" rx="170" ry="190" fill="${fondo}"/><g clip-path="url(#cl${patron})" transform="rotate(${Math.sin(lt*1.5)*3})">${c}</g></svg>`}
// Cabeza de frente con peinado de colores (persona del kit) y un cartelito
const cliente=(x,y,s,pelo,peinado,piel="#c98a5e",ropa="#2ad4c8",cara="feliz")=>P.persona(x,y,s,cara,piel,ropa,pelo,peinado);
const espejo=(html)=>`<div style="position:absolute;left:190px;top:660px;width:700px;height:820px;border-radius:350px 350px 30px 30px;background:radial-gradient(#3a2a5c,#1a1030);border:16px solid #f2c94c;box-shadow:0 0 50px #f2c94c66;overflow:hidden">${html}</div>${[0,1,2,3,4,5].map(i=>`<div style="position:absolute;left:${170+(i%2)*700}px;top:${700+Math.floor(i/2)*270}px;width:40px;height:40px;border-radius:50%;background:#fff6c8;box-shadow:0 0 30px #ffe08a"></div>`).join("")}`;
const etq=(t,x,y,k,c="#ff4fa3",tc="#fff")=>P.etiqueta(t,x,y,k,c,tc);
const mapa=(lt,sel)=>`<div style="position:absolute;left:90px;top:620px;width:900px;height:860px;border-radius:30px;background:#0f2a36;border:8px solid #2a2640;overflow:hidden"><div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 110px,#1d4352 110px 118px),repeating-linear-gradient(90deg,transparent 0 140px,#1d4352 140px 148px)"></div>
 <div style="position:absolute;left:40px;top:40px;width:520px;padding:20px;border-radius:20px;background:rgba(14,8,28,.95);font:800 34px Inter;color:#fff"><div style="color:#ff4fa3;font:900 36px 'Inter Display';margin-bottom:10px">✂ BARBERÍAS</div>${["Clip & Fade","Salon Belle","Estética Unisex Sara's"].map((n,i)=>`<div style="padding:12px 14px;margin:6px 0;border-radius:12px;${i==sel?"background:#ff4fa3;":"background:#221a3a;opacity:.7"}">${n}</div>`).join("")}</div></div>`;

const ESCENAS=[
{f:"Las *3 barberías* de *GTA 6* con los mejores cortes. Apunta.", p:(lt)=>P.edificios("#1d1533","#ffd36a",3,1)+P.suelo("#140f28")+poste(130,1200,lt)+poste(890,1200,lt)+nuca(320,1250,.8,"llamas",lt)+nuca(760,1250,.8,"telarana",lt)+sello("3 BARBERÍAS",280,560,sg(lt,.4,.8),"#d8ff1f")},
{f:"Abre el *mapa* y entra en la lista de *barberías*.", p:(lt)=>mapa(lt,Math.floor(lt*1.5)%3)},
{f:"*Una*: *Clip & Fade*. Para Lucía: *moños*, *trenzas* y *tintes* para todos los gustos.", p:(lt)=>{const i=Math.min(2,Math.floor(lt/1.6));return local(lt,"CLIP & FADE","#2ad4c8")+num(1,sg(lt,0,.4))+cliente(540,1500,1.5,["#f2e6d8","#3a1a10","#ff7ab6"][i],[2,3,1][i],"#e0ac7e","#ff4fa3")+etq(["MOÑOS","TRENZAS","TINTES"][i],390,1530,1,"#2ad4c8","#140f28")}},
{f:"Y para Jason: *cortes con dibujos* y *tintes* del color que quieras.", p:(lt)=>{const pt=["llamas","flores","llamas"][Math.min(2,Math.floor(lt/1.4))];return espejo(nuca(350,560,1.2,pt,lt))+num(1,1)+etq("CORTES CON DIBUJO",230,1540,sg(lt,.4,.8),"#2ad4c8","#140f28")}},
{f:"*Dos*: *Salon Belle*. Su especialidad: *trenzas* y *ondas*. Trenzas durísimas.", p:(lt)=>local(lt,"SALON BELLE","#ff4fa3","#3a1a3a")+num(2,sg(lt,0,.4))+cliente(540,1500,1.5,"#2b1a12",lt<2?3:0,"#8a5a3a","#f2c94c")+etq(lt<2?"TRENZAS":"ONDAS",420,1530,sg(lt,.6,1),"#ff4fa3")},
{f:"*Tres*: *Estética Unisex Sara's*. Está escondida y solo viene con la *Ultimate Edition*.", p:(lt)=>local(lt,"ESTÉTICA SARA'S","#d8ff1f","#1a2a3a")+num(3,sg(lt,0,.4))+P.etiqueta("ULTIMATE EDITION",300,1560,sg(lt,1.8,2.2),"#d8ff1f","#140f28")+`<div style="position:absolute;left:640px;top:1250px;font:900 120px 'Inter Display';opacity:${sg(lt,.8,1.2)}">💎</div>`},
{f:"Aquí, *rapados* con diseño: *telaraña*, *tigre*, *leopardo*… y de todos los colores.", p:(lt)=>{const i=Math.min(2,Math.floor(lt/1.5)),pt=["telarana","tigre","leopardo"][i];return espejo(nuca(350,560,1.2,pt,lt))+num(3,1)+etq(["TELARAÑA","TIGRE","LEOPARDO"][i],390,1540,1,"#d8ff1f","#140f28")}},
{f:"¿Con cuál te quedas? Te leo en los *comentarios*.", p:(lt)=>P.suelo("#140f28")+nuca(220,1200,.6,"llamas",lt)+nuca(540,1200,.6,"telarana",lt)+nuca(860,1200,.6,"leopardo",lt)+["1","2","3"].map((n,i)=>P.texto(n,195+i*320,1420,sg(lt,.3+i*.2,.7+i*.2),80,"#d8ff1f")).join("")+P.bocadillo("¿1, 2 o 3? 💬",340,640,sg(lt,.6,1))},
{f:"Y para jugar a *GTA 6* al mejor precio, píllalo con *Pillao*.", p:(lt)=>P.edificios("#1d1533","#ffd36a",3,1)+P.suelo("#140f28")+P.texto("GTA 6",300,660,sg(lt,.2,.6),200,"#ff4fa3")+P.texto("al mejor precio",250,900,sg(lt,.8,1.2),80,"#fff")},
];
montar(); iniciar();
</script></body></html>
