<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTA VI</title></head><body>
<script src="kit.js"></script>
<script>
const DUR=44.4;
const PALETA={cielo:"linear-gradient(180deg,#1a0b3d,#5b1a6e 38%,#e2477e 68%,#ff9a4a)",shader:["#1a0b3d","#5b1a6e","#e2477e","#ff9a4a","#2ad4c8"],acento:"#ff5fa2",shaderOpacidad:.8};
const IMAGENES=[];
const FRASES=[
 [0.2,3.8,"Este *flamenco* lleva haciendo cola desde *2013.*"],
 [3.9,7.8,"Ese año salió *GTA V*, y él dijo: «yo me pido el *siguiente*»."],
 [7.9,12.0,"Pasaron los años. Le creció la *barba*… y las *palmeras.*"],
 [12.1,16.2,"Y por fin llega el día: *GTA VI* sale el *19* de noviembre."],
 [16.3,20.6,"Vuelve a *Vice City*, en *Leonida*, un estado inspirado en *Florida.*"],
 [20.7,24.6,"Pero nuestro flamenco tiene una regla: no pagar *de más.*"],
 [24.7,30.0,"En *Kinguin* lo tiene para *Xbox* desde *62,72* euros."],
 [30.1,35.0,"Y para *PS5*, desde *70,35* euros."],
 [35.1,39.0,"Trece años de cola merecen un *buen* precio."],
 [39.1,44.2,"Entra en *pillaojuegos.com* y resérvalo en *Kinguin.*"],
];
const ROSA="#ff6fa8", ROSA2="#e2477e";
// Flamenco propio. o: {barba 0..1, gafas, salto px, ala 0..1, cara:"feliz|sorpresa|duda", mira:1|-1}
function flamenco(x,y,s=1,o={}){const b=o.barba||0, sal=o.salto||0, al=o.ala||0, m=o.mira||1, cara=o.cara||"feliz";
 const ojo=cara=="sorpresa"?`<circle cx="206" cy="92" r="11" fill="#fff"/><circle cx="208" cy="92" r="6" fill="#1a0b3d"/>`:cara=="duda"?`<path d="M197 92 h20" stroke="#1a0b3d" stroke-width="6" stroke-linecap="round"/>`:`<circle cx="206" cy="92" r="9" fill="#fff"/><circle cx="209" cy="93" r="5" fill="#1a0b3d"/>`;
 const gafas=o.gafas?`<rect x="190" y="80" width="36" height="22" rx="8" fill="#14092b"/><rect x="194" y="83" width="12" height="6" rx="3" fill="#2ad4c8" opacity=".8"/><path d="M190 88 l-22 -4" stroke="#14092b" stroke-width="5"/>`:"";
 const barba=b>0?`<path d="M214 118 q-12 ${30+b*140} ${-10-b*20} ${40+b*170} q-20 ${-30-b*80} -14 ${-40-b*130} Z" fill="#eee6f2" stroke="#cfc3d9" stroke-width="3"/>`:"";
 return `<svg style="position:absolute;left:${x-200*s}px;top:${y-560*s-sal}px;overflow:visible" width="${400*s}" height="${600*s}" viewBox="0 0 400 600"><g transform="${m<0?"translate(400 0) scale(-1 1)":""}">
  <path d="M150 380 L150 470 L132 560" stroke="#d94f86" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M175 380 L182 460 L${170+sal*.2} 500 L196 506" stroke="#d94f86" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M120 560 h30" stroke="#d94f86" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="160" cy="330" rx="100" ry="66" fill="${ROSA}"/>
  <path d="M80 320 q-50 -20 -70 20 q40 -6 70 10 Z" fill="${ROSA2}"/>
  <path d="M120 300 q50 ${-30-al*80} 110 ${-10-al*60} q-30 50 -110 50 Z" fill="${ROSA2}"/>
  <path d="M230 320 q60 -60 10 -140 q-40 -60 -20 -110" stroke="${ROSA}" stroke-width="30" fill="none" stroke-linecap="round"/>
  <circle cx="212" cy="96" r="38" fill="${ROSA}"/>
  ${barba}
  <path d="M236 92 q40 4 44 30 q-4 22 -20 30 q4 -26 -26 -40 Z" fill="#fff4e0"/><path d="M262 128 q16 -4 18 -6 q-4 22 -20 30 Z" fill="#1a0b3d"/>
  ${ojo}${gafas}</g></svg>`}
function palmera(x,h,k=1,ang=0){const H=h*k;return `<svg style="position:absolute;left:${x-160}px;top:${1520-H-140}px;overflow:visible" width="320" height="${H+140}" viewBox="0 0 320 ${H+140}">
 <path d="M160 ${H+140} q${-30} ${-H/2} ${10} ${-H}" stroke="#3b1640" stroke-width="26" fill="none" stroke-linecap="round"/>
 <g transform="translate(170 140) rotate(${ang})">${[-150,-110,-60,-20,20,60].map((a,i)=>`<path d="M0 0 q${Math.cos(a*Math.PI/180)*90} ${Math.sin(a*Math.PI/180)*90-40} ${Math.cos(a*Math.PI/180)*160} ${Math.sin(a*Math.PI/180)*160+30}" stroke="${i%2?"#1f8f7a":"#26b39a"}" stroke-width="22" fill="none" stroke-linecap="round"/>`).join("")}</g></svg>`}
function suelo(){return `<div style="position:absolute;left:0;right:0;top:1520px;bottom:0;background:linear-gradient(180deg,#f2b77a,#d98a5a)"></div><div style="position:absolute;left:0;right:0;top:1500px;height:30px;background:#2ad4c8;opacity:.55"></div>`}
function solGrande(y=1080){return `<div style="position:absolute;left:290px;top:${y}px;width:500px;height:500px;border-radius:50%;background:linear-gradient(180deg,#ffe17a,#ff7a5c);box-shadow:0 0 120px 40px rgba(255,140,90,.45)"></div>`+[0,1,2,3].map(i=>`<div style="position:absolute;left:280px;width:520px;top:${y+300+i*44}px;height:${10+i*4}px;background:#e2477e"></div>`).join("")}
function cartel(txt,x,y,col="#2ad4c8",k=1){return `<div style="position:absolute;left:${x}px;top:${y}px;padding:12px 26px;border:6px solid ${col};border-radius:18px;color:#fff;font:900 70px 'Inter Display';letter-spacing:-.02em;text-shadow:0 0 18px ${col},0 0 4px ${col};box-shadow:0 0 30px ${col}88,inset 0 0 20px ${col}55;opacity:${k};background:rgba(20,8,43,.55)">${txt}</div>`}
function calendario(x,y,top,abajo,rot=0){return `<div style="position:absolute;left:${x}px;top:${y}px;width:300px;height:300px;border-radius:24px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.4);transform:rotate(${rot}deg);overflow:hidden">
 <div style="height:90px;background:#e2477e;color:#fff;font:900 ${String(top).length>6?40:54}px 'Inter Display';display:flex;align-items:center;justify-content:center">${top}</div>
 <div style="height:210px;display:flex;align-items:center;justify-content:center;font:900 120px 'Inter Display';color:#1a0b3d;letter-spacing:-.04em">${abajo}</div></div>`}
function cola(){return `<div style="position:absolute;left:640px;top:1200px;width:360px;height:320px;background:#3b1640;border-radius:16px 16px 0 0"></div>
 <div style="position:absolute;left:640px;top:1160px;width:360px;height:70px;background:repeating-linear-gradient(90deg,#ff6fa8 0 45px,#fff 45px 90px);border-radius:12px"></div>
 <div style="position:absolute;left:700px;top:1290px;width:240px;height:230px;background:#14092b;border:6px solid #2ad4c8;border-radius:8px;color:#2ad4c8;font:800 34px 'DejaVu Sans Mono';display:flex;align-items:center;justify-content:center;text-align:center">CERRADO</div>
 ${[300,420,540].map(cx=>`<div style="position:absolute;left:${cx}px;top:1400px;width:14px;height:120px;background:#c9b25a;border-radius:6px"></div>`).join("")}
 <div style="position:absolute;left:306px;top:1410px;width:240px;height:40px;border-bottom:10px solid #b0174f;border-radius:0 0 120px 120px"></div>`}
function tele(x,y,w,txt,k=1){return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${w*.62}px;background:#14092b;border:14px solid #2a1650;border-radius:20px;box-shadow:0 0 50px rgba(42,212,200,.4);overflow:hidden">
 <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#2ad4c8,#1a0b3d 75%);opacity:.6"></div>
 <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:900 ${w*.2}px 'Inter Display';letter-spacing:-.03em;transform:scale(${.6+.4*eb(k)})">${txt}</div></div>`}
function bocadillo(txt,x,y,k){return k<=0?"":`<div style="position:absolute;left:${x}px;top:${y}px;padding:20px 30px;background:#fff;color:#1a0b3d;border-radius:30px;font:800 46px 'Inter';transform:scale(${eb(k)});transform-origin:0 100%;box-shadow:0 14px 30px rgba(0,0,0,.3)">${txt}<i style="position:absolute;left:30px;bottom:-26px;border:16px solid transparent;border-top:20px solid #fff"></i></div>`}
function confeti(lt){let h="";for(let i=0;i<70;i++){const x=rnd(i)*1080, v=300+rnd(i+3)*500, y=-60+lt*v-rnd(i+7)*300; if(y>1600) continue;
 h+=`<div style="position:absolute;left:${x+Math.sin(lt*3+i)*40}px;top:${y}px;width:18px;height:28px;background:${["#ff6fa8","#2ad4c8","#ffe17a","#fff"][i%4]};transform:rotate(${lt*300+i*40}deg)"></div>`}return h}
function coche(x){return `<svg style="position:absolute;left:${x}px;top:1400px" width="420" height="150" viewBox="0 0 420 150"><path d="M20 100 q10 -40 70 -46 l60 -40 h120 l60 40 q70 6 80 46 v24 h-390 Z" fill="#2ad4c8"/><path d="M160 22 h100 l46 34 h-190 Z" fill="#14092b" opacity=".7"/><circle cx="100" cy="124" r="26" fill="#14092b"/><circle cx="320" cy="124" r="26" fill="#14092b"/><circle cx="398" cy="96" r="8" fill="#ffe17a"/></svg>`}
function fila(r,i,lt,t0){const k=eo(sg(lt,t0+i*.35,t0+.4+i*.35));return `<div style="position:absolute;left:${120+(1-k)*80}px;top:${740+i*150}px;width:840px;padding:26px 34px;border-radius:22px;display:flex;justify-content:space-between;align-items:center;font:800 40px 'Inter';opacity:${k};background:${r[2]?"#ff5fa2":"rgba(255,255,255,.94)"};color:${r[2]?"#fff":"#1a0b3d"};box-shadow:0 14px 34px rgba(0,0,0,.3)"><span>Kinguin · ${r[0]}</span><b style="font:900 58px 'Inter Display';letter-spacing:-.03em">${r[1]}</b></div>`}
function escena(t){let h="";
 if(t<3.9){const lt=t; h+=solGrande()+suelo()+palmera(120,300)+cola()+flamenco(220,1520,1,{cara:"feliz"})+calendario(80,560,"AÑO",`2013`,-6*eo(sg(lt,.2,.8)));}
 else if(t<7.9){const lt=t-3.9; h+=solGrande()+suelo()+palmera(120,300)+cola()+tele(560,560,440,"GTA V",sg(lt,.2,.6))+flamenco(240,1520,1,{cara:"feliz",ala:sg(lt,1.8,2.2)})+bocadillo("¡Me pido el siguiente!",110,820,sg(lt,2,2.4));}
 else if(t<12.1){const lt=t-7.9, k=sg(lt,.3,3.8), año=2013+Math.min(13,Math.floor(k*13.99));
  h+=solGrande(1080+Math.sin(lt*5)*30)+suelo()+palmera(120,300+k*700)+palmera(940,200+k*500,1,8)+cola()+flamenco(300,1520,1,{cara:"duda",barba:k})+calendario(620,560,"AÑO",año,Math.sin(lt*14)*4);}
 else if(t<16.3){const lt=t-12.1, j=Math.abs(Math.sin(lt*6))*120*sg(lt,.6,1);
  h+=solGrande()+suelo()+palmera(120,1000)+palmera(940,700,1,8)+flamenco(320,1520,1,{cara:"sorpresa",barba:1,salto:j,ala:j/120})+calendario(560,520,"NOVIEMBRE","19",-4)+(lt>.6?confeti(lt-.6):"")+(lt>1.4?sello("¡YA SALE!",560,900,sg(lt,1.4,1.8),"#2ad4c8"):"");}
 else if(t<20.7){const lt=t-16.3; h+=solGrande(980)+suelo()+palmera(100,800,1,Math.sin(lt*2)*4)+palmera(980,640,1,8)+cartel("VICE CITY",260,560,"#ff5fa2",sg(lt,.2,.6))+cartel("LEONIDA",320,720,"#2ad4c8",sg(lt,1.4,1.8))+coche(-440+lt*420)+flamenco(860,1520,.8,{gafas:true,barba:1,mira:-1});}
 else if(t<24.7){const lt=t-20.7; h+=solGrande()+suelo()+palmera(120,800)+flamenco(380,1520,1.15,{cara:lt>1.6?"duda":"feliz",barba:1,ala:.3})+bocadillo("¿Pagar de más?<br>Ni de broma.",470,700,sg(lt,1.6,2))+(lt>.4?`<div style="position:absolute;left:640px;top:1100px;font:900 120px 'Inter Display';color:#ffe17a;text-shadow:0 0 30px rgba(255,225,122,.6);transform:rotate(${Math.sin(lt*4)*8}deg)">€ € €</div>`:"");}
 else if(t<35.1){const lt=t-24.7, ps=lt>5.4;
  h+=cartel(ps?"PS5":"XBOX",ps?400:360,560,ps?"#3d7bff":"#3ddc84",eo(sg(lt%5.4,.1,.4)));
  const rows=ps?[["PS5","70,35 €",1],["PS5","73,82 €",0]]:[["Xbox","62,72 €",1],["Xbox","69,34 €",0]];
  h+=rows.map((r,i)=>fila(r,i,ps?lt-5.4:lt,.6)).join("");
  const lt2=ps?lt-5.4:lt; if(lt2>1.6) h+=`<div style="position:absolute;left:0;right:0;top:1100px;text-align:center;font:800 34px 'DejaVu Sans Mono';color:#ffe1f0;opacity:${sg(lt2,1.6,2)}">DESDE</div><div style="position:absolute;left:0;right:0;top:1140px;text-align:center;font:900 190px 'Inter Display';letter-spacing:-.05em;color:#fff;text-shadow:0 0 40px rgba(255,95,162,.8)">${ps?contador(lt2,1.6,3,73.82,70.35):contador(lt2,1.6,3,69.34,62.72)}</div>`;
  h+=flamenco(880,1780,.7,{gafas:true,barba:1,mira:-1,ala:Math.abs(Math.sin(lt*4))});}
 else if(t<39.1){const lt=t-35.1; h+=solGrande()+suelo()+palmera(120,900,1,Math.sin(lt*3)*6)+palmera(960,700,1,Math.sin(lt*3+1)*6)+flamenco(540,1520,1.2,{gafas:true,barba:1,salto:Math.abs(Math.sin(lt*5))*60,ala:Math.abs(Math.sin(lt*5))})+sello("13 AÑOS",120,720,sg(lt,.3,.7),"#ffe17a")+sello("BUEN PRECIO",560,1560,sg(lt,1.6,2),"#2ad4c8");}
 else {const lt=t-39.1; h+=solGrande(1100)+suelo()+palmera(120,700)+flamenco(860,1520,.8,{gafas:true,barba:1,mira:-1,ala:Math.abs(Math.sin(lt*4))})+cierre(lt,"#ff5fa2")+`<div style="position:absolute;left:0;right:0;top:990px;text-align:center;opacity:${sg(lt,1.2,1.6)};font:800 40px 'Inter';color:#fff">GTA VI · Xbox y PS5 · claves en Kinguin</div>`;}
 return h}
iniciar();
</script></body></html>
