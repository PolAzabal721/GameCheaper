<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gta6randy</title></head><body>
<script src="kit.js"></script>
<script src="historia.js"></script>
<script>
// GTA 6: cómo conseguir el localizador avanzado (misiones de los coches de Randy). Dibujos genéricos propios: nada de personajes ni logos del juego.
const PALETA={cielo:"linear-gradient(180deg,#1a0b2e,#4a1a5c 40%,#c2408a 75%,#ff9a6a)",shader:["#1a0b2e","#4a1a5c","#c2408a","#ff9a6a","#0d3b4f"],acento:"#ff4fa3",suelo:"#14102a"};
const JUEGO={titulo:"Grand Theft Auto VI",tituloCaja:"GRAND THEFT<br>AUTO VI",titCaja:.1,tiendaNombre:"CJS CD Keys",precio:64.78,pvp:73.99,plat:"PS5",clave:"Clave PSN"};
const ESC0=0;
// Piezas propias de este vídeo
const movil=(x,y,s,html)=>`<div style="position:absolute;left:${x}px;top:${y}px;width:${360*s}px;height:${700*s}px;border-radius:${46*s}px;background:#0e0c18;border:${10*s}px solid #2a2640;box-shadow:0 30px 70px rgba(0,0,0,.55);overflow:hidden"><div style="position:absolute;left:50%;top:${14*s}px;width:${90*s}px;height:${18*s}px;margin-left:${-45*s}px;border-radius:9px;background:#2a2640"></div><div style="position:absolute;inset:${48*s}px ${18*s}px ${18*s}px">${html}</div></div>`;
const msg=(txt,k,s=1,yo=false)=>k<=0?"":`<div style="margin:${10*s}px 0;${yo?"margin-left:auto;background:#ff4fa3;color:#fff;":"background:#2f2b47;color:#fff;"}max-width:86%;padding:${14*s}px ${18*s}px;border-radius:${20*s}px;font:700 ${26*s}px 'Inter';transform:scale(${eb(cl(k))});transform-origin:0 0;opacity:${cl(k*3)}">${txt}</div>`;
const cabMsg=(s=1)=>`<div style="display:flex;align-items:center;gap:${12*s}px;padding-bottom:${12*s}px;border-bottom:2px solid #2a2640"><div style="width:${52*s}px;height:${52*s}px;border-radius:50%;background:linear-gradient(135deg,#ff9a6a,#c2408a);display:grid;place-items:center;font:900 ${26*s}px 'Inter Display';color:#fff">R</div><b style="font:800 ${30*s}px 'Inter';color:#fff">Randy</b></div>`;
const neon=(txt,x,y,col,k=1,tam=70)=>`<div style="position:absolute;left:${x}px;top:${y}px;padding:14px 26px;border:5px solid ${col};border-radius:16px;font:900 ${tam}px 'Inter Display';color:#fff;letter-spacing:-.02em;opacity:${cl(k*2)};text-shadow:0 0 18px ${col},0 0 40px ${col};box-shadow:0 0 30px ${col}aa,inset 0 0 20px ${col}66">${txt}</div>`;
const pin=(x,y,k,col="#ff3a4a")=>`<div style="position:absolute;left:${x-40}px;top:${y-110+(1-eb(cl(k)))*-60}px;opacity:${cl(k*3)}"><svg width="80" height="110" viewBox="0 0 80 110"><path d="M40 108 C10 70 0 55 0 40 a40 40 0 0 1 80 0 c0 15 -10 30 -40 68 Z" fill="${col}"/><circle cx="40" cy="40" r="15" fill="#fff"/></svg></div>`;
const radar=(x,y,r,lt,col="#ff3a4a")=>`<div style="position:absolute;left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;border:6px solid ${col};opacity:${1-(lt*.8%1)};transform:scale(${.3+(lt*.8%1)*.9})"></div><div style="position:absolute;left:${x-18}px;top:${y-18}px;width:36px;height:36px;border-radius:50%;background:${col};box-shadow:0 0 30px ${col}"></div>`;
const mapa=(lt,html)=>`<div style="position:absolute;left:90px;top:520px;width:900px;height:900px;border-radius:30px;background:#0f2a36;border:8px solid #2a2640;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5)"><div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 110px,#1d4352 110px 118px),repeating-linear-gradient(90deg,transparent 0 140px,#1d4352 140px 148px)"></div><div style="position:absolute;left:600px;top:-40px;width:400px;height:1000px;background:#155a7a;transform:rotate(8deg)"></div>${html}</div>`;
const garaje=(x,y,k)=>`<div style="position:absolute;left:${x}px;top:${y}px;width:620px;height:420px;background:#2a2640;border-radius:16px 16px 0 0"><div style="position:absolute;left:40px;right:40px;top:60px;bottom:0;background:repeating-linear-gradient(0deg,#4a4568 0 34px,#3a3655 34px 40px);transform:translateY(${-eo(cl(k))*0}px)"></div></div>`;
const candado=(x,y,k)=>`<svg style="position:absolute;left:${x}px;top:${y}px;transform:scale(${eb(cl(k))});opacity:${cl(k*3)}" width="200" height="240" viewBox="0 0 200 240"><path d="M50 110 V70 a50 50 0 0 1 100 0 V110" stroke="#f2c94c" stroke-width="22" fill="none"/><rect x="20" y="100" width="160" height="130" rx="22" fill="#f2c94c"/><circle cx="100" cy="155" r="18" fill="#6b4a12"/><rect x="92" y="160" width="16" height="40" rx="6" fill="#6b4a12"/></svg>`;
const ciudad=(lt)=>P.edificios("#1d1533","#ffd36a",3,1)+P.palmera(120,420,Math.sin(lt*2)*4)+P.palmera(960,360,Math.sin(lt*2+1)*4)+P.suelo("#14102a");
const ESCENAS=[
{f:"¿Quieres coches con el *localizador avanzado* en *GTA 6*?", p:(lt)=>ciudad(lt)+P.coche(330-(1-eo(sg(lt,0,1)))*700,1500,1.1,"#ff4fa3")+radar(560,1300,140,lt)+P.texto("LOCALIZADOR",260,560,sg(lt,.6,1),110,"#ff3a4a")},
{f:"Hasta que no hagas las misiones de *Randy*, no puedes *registrar* coches ni quedártelos.", p:(lt)=>P.suelo("#14102a")+garaje(230,1080,1)+P.coche(330,1500,1.1,"#2ad4c8")+candado(440,700,sg(lt,.8,1.3))+P.etiqueta("SIN REGISTRAR",300,560,sg(lt,1.6,2),"#ff3a4a","#fff")},
{f:"Randy te pasa una *lista de coches*. Te digo dónde están.", p:(lt)=>ciudad(lt)+movil(270,400,1.5,cabMsg(1.5)+msg("Necesito estos coches 🚗",sg(lt,.4,.8),1.5)+msg("1. Ocean Beach",sg(lt,1,1.3),1.5)+msg("2. Isla Vespucci",sg(lt,1.4,1.7),1.5)+msg("3. The Vault / NINE1NINE",sg(lt,1.8,2.1),1.5)+msg("4. Belville",sg(lt,2.2,2.5),1.5))},
{f:"El primero, en *Ocean Beach*: en el tramo de *césped* tipo parque que da a la *playa*.", p:(lt)=>P.sol(820,700,120,"#ffb36a")+P.mar(lt,1250)+P.arena(1380)+`<div style="position:absolute;left:0;right:0;top:1440px;bottom:0;background:#3aa65a"></div>`+P.palmera(180,380,Math.sin(lt*2)*4)+P.palmera(900,330,Math.sin(lt*2+2)*4)+P.coche(330,1600,1.1,"#ffd34f")+pin(540,1380,sg(lt,.8,1.2))+P.cartel("OCEAN BEACH",80,560,"#c2408a",56)},
{f:"Otro sale en la *Isla Vespucci*.", p:(lt)=>P.mar(lt,1100,"#1d6f9a")+`<div style="position:absolute;left:180px;top:1180px;width:720px;height:320px;border-radius:50%;background:#f2cf8a"></div><div style="position:absolute;left:260px;top:1150px;width:560px;height:220px;border-radius:50%;background:#3aa65a"></div>`+P.palmera(300,300,Math.sin(lt*2)*4)+P.coche(420,1360,.9,"#7a5cff")+pin(600,1200,sg(lt,.6,1))+P.cartel("ISLA VESPUCCI",280,520,"#1d6f9a",56)},
{f:"Más coches en los locales *The Vault* y *NINE1NINE*.", p:(lt)=>P.edificios("#120d24","#ff4fa3",7,.9)+P.suelo("#14102a")+neon("THE VAULT",90,600,"#2ad4c8",sg(lt,.3,.8),78)+neon("NINE1NINE",500,820,"#ff4fa3",sg(lt,.9,1.4),78)+P.coche(60,1560,.95,"#ff6a3a")+P.coche(560,1560,.95,"#2ad4c8")},
{f:"Y el último de la lista, en *Belville*: el *Buckingham Jubilee*.", p:(lt)=>ciudad(lt)+P.coche(300,1500,1.3,"#e8e4f0")+P.etiqueta("BUCKINGHAM JUBILEE",120,1150,sg(lt,1.2,1.6),"#ff4fa3","#fff")+P.cartel("BELVILLE",340,520,"#4a1a5c",60)},
{f:"Luego espera a que Randy te mande un *mensaje*: tienes que robar el *último coche*.", p:(lt)=>ciudad(lt)+movil(270,400,1.5,cabMsg(1.5)+msg("Buen trabajo 👌",sg(lt,.4,.8),1.5)+msg("Me falta uno. Róbalo y tráemelo.",sg(lt,1.2,1.6),1.5)+msg("Te lo marco en el mapa 📍",sg(lt,2,2.4),1.5))},
{f:"Te sale *marcado* en el mapa. Vas a por él… y lo *robas*.", p:(lt)=>mapa(lt,pin(560,420,sg(lt,.3,.7))+radar(560,410,120,lt)+P.coche(120+eo(sg(lt,1.4,3))*300,700,.8,"#ff4fa3"))},
{f:"Lo entregas, y Randy te escribe: ya tienes el *localizador avanzado*.", p:(lt)=>ciudad(lt)+movil(270,400,1.5,cabMsg(1.5)+msg("Perfecto. Trato hecho.",sg(lt,.5,.9),1.5)+msg("Ya tienes el localizador avanzado 🔴",sg(lt,1.4,1.8),1.5))+radar(540,1360,150,lt)+P.flash(lt,1.5,"#ff3a4a")},
{f:"Ahora ya puedes *registrar* tus coches y *quedártelos*.", p:(lt)=>P.suelo("#14102a")+garaje(230,1080,1)+P.coche(330,1500,1.1,"#2ad4c8")+P.etiqueta("✓ REGISTRADO",330,600,sg(lt,.5,.9),"#2ad48a","#0b2a1a")+radar(540,1300,120,lt)},
{f:"¿Aún no tienes *GTA 6*? Píllalo al precio más barato con *Pillao*.", p:(lt)=>ciudad(lt)+P.texto("GTA 6",300,620,sg(lt,.2,.6),200,"#ff4fa3")+P.texto("al mejor precio",250,860,sg(lt,.8,1.2),80,"#fff")},
];
montar(); iniciar();
</script></body></html>
