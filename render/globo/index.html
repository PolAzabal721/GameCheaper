<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";font-weight:600;src:url(fuentes/Inter-SemiBold.otf)}
@font-face{font-family:"Inter";font-weight:700;src:url(fuentes/Inter-Bold.otf)}
@font-face{font-family:"Inter";font-weight:800;src:url(fuentes/Inter-ExtraBold.otf)}
@font-face{font-family:"Inter Display";font-weight:900;src:url(fuentes/InterDisplay-Black.otf)}
@font-face{font-family:"DejaVu Sans Mono";font-weight:700;src:url(fuentes/DejaVuSansMono-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a0b33}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Inter",sans-serif}
#cielo{position:absolute;inset:0;background:linear-gradient(180deg,#140726 0%,#2a0f4d 45%,#5a1f7a 80%,#7a2a86 100%)}
#estrellas{position:absolute;inset:0}
#esc{position:absolute;inset:0}
canvas{position:absolute;left:0;top:0}
#sub{position:absolute;left:80px;right:80px;top:230px;text-align:center;font-size:52px;line-height:1.25;font-weight:600;z-index:5}
#sub span{color:rgba(255,255,255,.38)}
#sub span.ya,#sub span.on{color:#fff}
#sub span.on{font-weight:800}
#sub span.k{outline:3px solid #6aa8ff;outline-offset:4px;border-radius:4px;background:rgba(40,60,140,.35)}
.tagp{display:inline-block;background:#1f6e5a;color:#d9ffe9;border:3px solid #7ff0c0;border-radius:12px;font:800 30px "Inter";padding:4px 14px;letter-spacing:.02em}
.reloj{display:inline-block;background:#3a0f22;color:#ff5a7a;border:3px solid #ff5a7a;border-radius:10px;font:700 40px "DejaVu Sans Mono";padding:2px 12px;box-shadow:0 0 18px rgba(255,90,122,.45)}
.dato{position:absolute;background:rgba(20,8,40,.88);color:#fff;font-weight:800;border-radius:16px;padding:10px 20px;font-size:54px;box-shadow:0 0 0 2px rgba(255,255,255,.14)}
</style></head><body><div id="st">
<div id="cielo"></div><div id="shader" style="position:absolute;inset:0;opacity:.9"></div><div id="estrellas"></div>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="esc"></div>
<div style="position:absolute;left:0;right:0;top:0;height:520px;background:linear-gradient(180deg,rgba(12,4,24,.7),rgba(12,4,24,0));z-index:4"></div>
<div id="sub"></div>
</div>
<script src="lib/d3-array.min.js"></script>
<script src="lib/d3-geo.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), sg=(t,a,b)=>cl((t-a)/(b-a));
const eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2, eo=x=>1-Math.pow(1-x,3), eb=x=>{const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function rnd(n){const x=Math.sin(n*91.7+12.3)*43758.5453;return x-Math.floor(x)}
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let paises=null;
const ROSA=new Set(["724"]); // España resaltada
const LUGARES={es:[-3.7,40.4],tk:[139.7,35.7],ny:[-74,40.7]};
// estrellas fijas
(function(){let h="";for(let i=0;i<90;i++)h+=`<div style="position:absolute;left:${rnd(i)*1080}px;top:${rnd(i+90)*1300}px;width:${2+rnd(i+5)*3}px;height:${2+rnd(i+5)*3}px;border-radius:50%;background:#fff;opacity:${.2+rnd(i+7)*.6}"></div>`;document.getElementById("estrellas").innerHTML=h})();

function globo(lon,lat,r,cx,cy,resaltar,extra){
 ctx.clearRect(0,0,1080,1920);
 const pr=d3.geoOrthographic().scale(r).translate([cx,cy]).rotate([-lon,-lat]).clipAngle(90);
 const path=d3.geoPath(pr,ctx);
 // halo
 const g=ctx.createRadialGradient(cx,cy,r*.9,cx,cy,r*1.25); g.addColorStop(0,"rgba(190,90,255,.35)"); g.addColorStop(1,"rgba(190,90,255,0)");
 ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*1.25,0,7); ctx.fill();
 // océano
 const o=ctx.createRadialGradient(cx-r*.35,cy-r*.35,r*.1,cx,cy,r); o.addColorStop(0,"#3b5fd6"); o.addColorStop(1,"#1a1f6e");
 ctx.fillStyle=o; ctx.beginPath(); path({type:"Sphere"}); ctx.fill();
 // países
 for(const f of paises.features){ctx.beginPath(); path(f);
  const on=resaltar.has(f.id); ctx.fillStyle=on?"#ff6fc4":"#24336e"; ctx.fill();
  ctx.strokeStyle=on?"#ffd0ec":"rgba(140,170,255,.35)"; ctx.lineWidth=on?2:1; ctx.stroke()}
 // línea de medianoche (meridiano que se mueve)
 ctx.beginPath(); path({type:"LineString",coordinates:[[extra.mer,-89],[extra.mer,0],[extra.mer,89]]}); ctx.strokeStyle="#ff4fd8"; ctx.lineWidth=6; ctx.shadowColor="#ff4fd8"; ctx.shadowBlur=18; ctx.stroke(); ctx.shadowBlur=0;
 // borde y brillo
 ctx.beginPath(); path({type:"Sphere"}); ctx.strokeStyle="rgba(210,190,255,.75)"; ctx.lineWidth=5; ctx.stroke();
 ctx.beginPath(); ctx.arc(cx-r*.15,cy-r*.15,r*.92,3.6,4.3); ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=10; ctx.stroke();
 return pr;
}
// Caseta con persona (dibujo propio)
function persona(tipo,piel,ropa,pelo,peinado){ // dibujo propio en un lienzo de 400x400
 const dorm=tipo=="dorm";
 const ojos = dorm ? `<path d="M152 205 q16 12 32 0 M216 205 q16 12 32 0" stroke="#3a2412" stroke-width="7" fill="none" stroke-linecap="round"/>`
  : `${[168,232].map(x=>`<ellipse cx="${x}" cy="${tipo=="sorpresa"?200:204}" rx="17" ry="${tipo=="sorpresa"?22:19}" fill="#fff"/><circle cx="${x+3}" cy="${tipo=="sorpresa"?202:206}" r="${tipo=="sorpresa"?8:10}" fill="#2b1a0e"/><circle cx="${x+7}" cy="${tipo=="sorpresa"?197:201}" r="3.5" fill="#fff"/>`).join("")}`;
 const cejas = tipo=="sorpresa" ? `<path d="M148 168 q20 -14 40 -2 M212 166 q20 -12 40 2" stroke="${pelo}" stroke-width="8" fill="none" stroke-linecap="round"/>`
  : dorm ? "" : `<path d="M150 178 q18 -8 36 0 M214 178 q18 -8 36 0" stroke="${pelo}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
 const boca = tipo=="feliz" ? `<path d="M176 248 q24 26 48 0 Z" fill="#7a1f2b"/><path d="M182 250 q18 8 36 0" stroke="#fff" stroke-width="5" fill="none"/>`
  : tipo=="sorpresa" ? `<ellipse cx="200" cy="256" rx="14" ry="18" fill="#7a1f2b"/>`
  : dorm ? `<path d="M188 250 q12 6 24 0" stroke="#7a3a2a" stroke-width="6" fill="none" stroke-linecap="round"/>`
  : `<path d="M184 250 q16 8 32 0" stroke="#7a3a2a" stroke-width="6" fill="none" stroke-linecap="round"/>`;
 const pelos = peinado==1 ? `<path d="M118 196 q-8 -96 82 -100 q92 2 84 100 q-14 -50 -44 -58 q-30 18 -84 4 q-26 20 -38 54 Z" fill="${pelo}"/>`
  : peinado==2 ? `<path d="M120 200 q-10 -100 80 -104 q90 4 82 104 q-6 -34 -26 -52 q-60 22 -112 -2 q-18 22 -24 54 Z" fill="${pelo}"/><circle cx="200" cy="86" r="26" fill="${pelo}"/>`
  : `<path d="M122 190 q4 -86 78 -92 q80 4 80 92 q-30 -40 -80 -40 q-50 0 -78 40 Z" fill="${pelo}"/>`;
 const cuerpo = `<path d="M70 400 q4 -96 130 -100 q126 4 130 100 Z" fill="${ropa}"/><path d="M168 300 l32 34 l32 -34" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="10" stroke-linejoin="round"/><rect x="182" y="270" width="36" height="34" rx="10" fill="${piel}" filter="brightness(.9)"/>`;
 const cabeza = `<ellipse cx="124" cy="214" rx="16" ry="22" fill="${piel}"/><ellipse cx="276" cy="214" rx="16" ry="22" fill="${piel}"/>
  <ellipse cx="200" cy="208" rx="78" ry="86" fill="${piel}"/><ellipse cx="200" cy="230" rx="78" ry="64" fill="rgba(0,0,0,.06)"/>
  <ellipse cx="150" cy="236" rx="16" ry="10" fill="#ff8a8a" opacity=".45"/><ellipse cx="250" cy="236" rx="16" ry="10" fill="#ff8a8a" opacity=".45"/>
  <path d="M196 214 q-8 14 4 18" stroke="rgba(0,0,0,.25)" stroke-width="5" fill="none" stroke-linecap="round"/>`;
 if(dorm) return `<svg viewBox="0 0 400 400" width="100%" height="100%" style="position:absolute;inset:0">
  <ellipse cx="200" cy="232" rx="160" ry="70" fill="#e9e4f7"/><ellipse cx="200" cy="226" rx="150" ry="58" fill="#f7f4ff"/>
  <g transform="rotate(-12 200 220)">${cabeza}${pelos}${ojos}${boca}</g>
  <path d="M30 400 q10 -112 170 -112 q160 0 170 112 Z" fill="#6c7bd8"/><path d="M40 330 q160 -40 320 0" stroke="#8d9aec" stroke-width="18" fill="none"/>
  <path d="M60 372 l40 0 M140 362 l40 0 M240 362 l40 0 M300 372 l40 0" stroke="#5a68c6" stroke-width="8" stroke-linecap="round"/></svg>`;
 return `<svg viewBox="0 0 400 400" width="100%" height="100%" style="position:absolute;inset:0">${cuerpo}${cabeza}${pelos}${cejas}${ojos}${boca}</svg>`}
function caseta({x,y,w=440,col="#1f6e5a",pais,hora,persona:tp="dorm",fondo="#3b1d66",pantalla="",piel="#f0b98a",ropa="#c0392b",zz=0,pelo="#2b1a0e",peinado=0,luz="#ffcf7a"}){
 const h=w*1.25, win=w*.84;
 return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))">
  <div style="position:absolute;left:-${w*.04}px;right:-${w*.04}px;top:0;height:${h*.07}px;border-radius:12px 12px 0 0;background:repeating-linear-gradient(90deg,${col} 0 ${w/10}px,#f4efe6 ${w/10}px ${w/5}px);box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)"></div>
  <div style="position:absolute;left:0;right:0;top:${h*.07}px;height:${h*.12}px;background:${col};display:flex;align-items:center;justify-content:space-between;padding:0 ${w*.035}px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)"><span class="tagp" style="font-size:${w/16}px">${pais}</span><span class="reloj" style="font-size:${w/12}px">${hora}</span></div>
  <div style="position:absolute;left:0;right:0;top:${h*.19}px;bottom:0;background:linear-gradient(180deg,${col},rgba(0,0,0,.35)),${col};border-radius:0 0 10px 10px"></div>
  <div style="position:absolute;left:${w*.08}px;right:${w*.08}px;top:${h*.23}px;height:${win}px;background:${fondo};border:7px solid #efe9f7;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.35),0 0 40px ${luz}55">
   <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,${luz}33,transparent 65%)"></div>
   ${persona(tp,piel,ropa,pelo,peinado)}${pantalla}
   ${zz?`<div style="position:absolute;left:${win*.68}px;top:${win*.1-zz*24}px;font:900 ${w/9}px 'Inter Display';color:#dfe8ff;opacity:${1-zz*.7}">Z<span style="font-size:.7em">z</span></div>`:""}
   <div style="position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.10) 48%,rgba(255,255,255,0) 56%)"></div>
  </div>
  <div style="position:absolute;left:${w*.08}px;right:${w*.08}px;bottom:${h*.025}px;height:${h*.04}px;display:flex;justify-content:space-around">${[...Array(6)].map(()=>`<i style="width:${w*.035}px;height:${w*.035}px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 12px #ffd36a"></i>`).join("")}</div>
 </div>`}
function calle(){return `<div style="position:absolute;left:0;right:0;top:1500px;bottom:0;background:#191226"></div>
 <div style="position:absolute;left:0;right:0;top:1640px;height:10px;background:repeating-linear-gradient(90deg,#f2c94c 0 70px,transparent 70px 130px)"></div>
 <div style="position:absolute;left:0;right:0;top:1150px;height:350px;background:
  linear-gradient(#24163a,#24163a) 40px 120px/120px 230px no-repeat,linear-gradient(#24163a,#24163a) 200px 40px/150px 310px no-repeat,
  linear-gradient(#24163a,#24163a) 720px 80px/140px 270px no-repeat,linear-gradient(#24163a,#24163a) 900px 0/150px 350px no-repeat;opacity:.9"></div>`}
function luna(x,y,s=1){return `<div style="position:absolute;left:${x}px;top:${y}px;width:${70*s}px;height:${70*s}px;border-radius:50%;box-shadow:${-14*s}px ${8*s}px 0 0 #f4f1ff;transform:rotate(-20deg)"></div>`}
function sol(x,y){return `<div style="position:absolute;left:${x}px;top:${y}px;width:110px;height:110px;border-radius:50%;background:#ffe08a;box-shadow:0 0 80px 30px rgba(255,210,120,.5)"></div>`}
function etiq(txt,glow=1){return `<div style="display:inline-block;padding:14px 26px;border-radius:20px;background:#d8ff1f;color:#1a0b33;font:900 84px 'Inter Display';letter-spacing:-.04em;box-shadow:0 0 ${50*glow}px ${16*glow}px rgba(216,255,31,.5)">${txt}</div>`}

const FRASES=[
 [0.2,3.3,"¿Sabías que los *chollos* nunca duermen?"],
 [3.4,7.6,"Cuando en España son las *3* de la madrugada, tú estás *durmiendo…*"],
 [7.7,12.0,"…pero en el resto del mundo las tiendas siguen *cambiando* precios."],
 [12.1,16.4,"Y justo esa noche, Hogwarts Legacy baja de 74,99 a *7,32* euros."],
 [16.5,21.0,"Tú no lo ves. Pero *Pillao* sí: revisa más de *40* tiendas varias veces al *día.*"],
 [21.1,25.6,"Lo compara con todas las demás… y lo manda a *Telegram.*"],
 [25.7,30.0,"Por la mañana te *despiertas,* miras el móvil… y ahí está."],
 [30.1,34.0,"Mientras otros pagan *74,99,* tú pagas *7,32.*"],
 [34.1,38.6,"No es suerte: es *Pillao.* Compara en *pillaojuegos.com*"],
];
function subt(t){const f=FRASES.find(f=>t>=f[0]&&t<f[1]+.25); if(!f) return "";
 const ws=f[2].split(" "), per=(f[1]-f[0])/ws.length;
 return ws.map((w,i)=>{const k=w.includes("*"); w=w.replace(/\*/g,""); const ts=f[0]+i*per; const st=t>=ts+per?"ya":t>=ts?"on":"";
  return `<span class="${st} ${k&&t>=ts?"k":""}">${w}</span>`}).join(" ")}

window.render=function(t){
 if(window.shaderFrame) window.shaderFrame(t*600);
 let h=""; cv.style.display="none";
 const est=document.getElementById("estrellas"); est.style.opacity=1;
 if(t<3.4){ // globo girando
  cv.style.display="block"; const k=eo(sg(t,0,1.2));
  globo(-60+t*25,20,380+k*40,540,1050,new Set(),{mer:-30+t*20});
 } else if(t<7.7){ // caseta España dormido
  const lt=t-3.4; h+=calle()+luna(860,560,1.3);
  h+=caseta({x:220,y:760,w:640,col:"#a5512a",pais:"ESPAÑA",hora:"03:00",persona:"dorm",fondo:"#2b1747",ropa:"#c0392b",zz:(lt*.8)%1});
  if(lt>1.2) h+=`<div class="dato" style="left:90px;top:1560px;opacity:${sg(lt,1.2,1.5)}">03:00<span style="font-size:28px"> 🌙</span></div>`;
 } else if(t<12.1){ // globo con ciudades despiertas
  cv.style.display="block"; const lt=t-7.7; const k=eio(sg(lt,0,3.5));
  const L=140-k*215; const pr=globo(L,30,470,540,1150,new Set(["392","840","724"]),{mer:-60+lt*5});
  const pts=[["TOKIO","11:00",LUGARES.tk,1.2],["NUEVA YORK","21:00",LUGARES.ny,.4],["ESPAÑA","03:00",LUGARES.es,0]];
  for(const [n,hh,ll,d] of pts){const p=pr(ll); const vis=d3.geoDistance(ll,[L,30])<1.45; if(!p||!vis) continue;
   const a=1; const pulse=(lt*1.5+d)%1;
   h+=`<div style="position:absolute;left:${p[0]-10}px;top:${p[1]-10}px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 ${pulse*50}px rgba(255,111,196,${.5-pulse*.5});opacity:${a}"></div>
    <div style="position:absolute;left:${p[0]+20}px;top:${p[1]-70}px;opacity:${a};text-align:left"><span class="tagp" style="font-size:24px">${n}</span><br><span class="reloj" style="font-size:32px;margin-top:6px">${hh}</span></div>`}
 } else if(t<16.5){ // la bajada de precio
  const lt=t-12.1; h+=calle()+luna(120,560,1);
  h+=`<div style="position:absolute;left:330px;top:640px;width:420px;height:630px;border-radius:12px;background:url(img/hogwarts.jpg) center/cover;box-shadow:0 0 0 6px #d8ff1f,0 30px 60px rgba(0,0,0,.5);transform:rotate(-3deg)"></div>`;
  const kp=eo(sg(lt,1.2,2.6)); const v=74.99+(7.32-74.99)*kp;
  h+=`<div style="position:absolute;left:0;right:0;top:1320px;text-align:center">${etiq(v.toFixed(2).replace(".",",")+" €",.6+.4*Math.sin(t*6))}</div>`;
  if(lt>2.7) h+=`<div class="dato" style="left:680px;top:600px;background:#ff4fd8;color:#1a0b33;transform:rotate(8deg) scale(${eb(sg(lt,2.7,3))})">-90%</div>`;
 } else if(t<21.1){ // caseta Pillao despierta revisando tiendas
  const lt=t-16.5; h+=calle()+luna(860,560,1.1);
  const n=Math.min(40,Math.floor(sg(lt,.8,3.2)*40));
  const pant=`<div style="position:absolute;right:16px;bottom:16px;width:190px;height:130px;background:#0b1424;border:4px solid #8fd3ff;border-radius:8px;font:700 18px 'DejaVu Sans Mono';color:#d8ff1f;padding:8px;line-height:1.3">TIENDAS<br><span style="font-size:44px">${n}/40</span><br><span style="color:#ff6fc4">${lt>3.2?"¡CHOLLO!":"···"}</span></div>`;
  h+=caseta({x:220,y:760,w:640,col:"#1f6e5a",pais:"PILLAO",hora:"03:01",persona:lt>3.2?"sorpresa":"normal",fondo:"#3b1d66",ropa:"#d8ff1f",piel:"#f3c49c",peinado:1,pelo:"#6b3b1f",luz:"#8fd3ff",pantalla:pant});
 } else if(t<25.7){ // globo + avión de papel hacia Telegram
  cv.style.display="block"; const lt=t-21.1;
  const pr=globo(-3.7,40,520,540,1150,new Set(["724"]),{mer:-10+lt*3});
  const p=pr(LUGARES.es); const k=eo(sg(lt,.5,2.6)); const ang=lt*2.2;
  const px=p[0]+Math.cos(ang)*330*k, py=p[1]-60-Math.sin(ang)*240*k;
  h+=`<svg style="position:absolute;left:${px-50}px;top:${py-50}px;transform:rotate(${-ang*40}deg)" width="100" height="100" viewBox="0 0 100 100"><path d="M8 48 L92 12 L70 88 L50 62 Z" fill="#ffffff"/><path d="M50 62 L92 12 L44 56 Z" fill="#cfd8ff"/><path d="M50 62 L58 80 L44 56 Z" fill="#9fb0e8"/></svg>`;
  if(lt>2.4) h+=`<div style="position:absolute;left:250px;top:620px;width:580px;padding:22px 26px;border-radius:24px;background:#fff;color:#111;box-shadow:0 20px 40px rgba(0,0,0,.4);transform:translateY(${(1-eo(sg(lt,2.4,2.8)))*-60}px);opacity:${sg(lt,2.4,2.7)}">
   <div style="font:800 24px 'Inter';color:#2a7fd4">Pillao Chollos · Telegram</div><div style="font:800 34px 'Inter';margin-top:6px">🔥 Hogwarts Legacy</div><div style="font:600 28px 'Inter';color:#444">PC · 7,32 € en Yuplay (-90 %)</div></div>`;
 } else if(t<30.1){ // por la mañana
  const lt=t-25.7; est.style.opacity=.2;
  h+=`<div style="position:absolute;inset:0;background:linear-gradient(180deg,#f6a26b,#e86f8a 45%,#7a2a86);opacity:.75"></div>`+calle()+sol(820,560);
  const pant=lt>1.4?`<div style="position:absolute;right:20px;bottom:24px;width:120px;height:200px;border-radius:18px;background:#111;border:4px solid #444;padding:10px"><div style="width:100%;height:100%;border-radius:10px;background:#fff;font:800 15px 'Inter';color:#111;padding:6px">🔥 Hogwarts<br><span style="font:900 26px 'Inter Display';color:#2a9d2a">7,32€</span></div></div>`:"";
  h+=caseta({x:220,y:760,w:640,col:"#a5512a",pais:"ESPAÑA",hora:"08:00",persona:lt>1.6?"feliz":"normal",fondo:"linear-gradient(180deg,#8fd0ff,#cfeaff)",luz:"#ffe7a0",ropa:"#c0392b",pantalla:pant});
 } else if(t<34.1){ // comparación: otros vs tú
  const lt=t-30.1; h+=calle()+luna(80,600,.9);
  h+=caseta({x:40,y:900,w:480,col:"#5a2a7a",pais:"OTROS",hora:"74,99€",persona:"sorpresa",fondo:"#3b1d66",ropa:"#4a6fd4",piel:"#c98b5e",peinado:2,pelo:"#1a1410"});
  h+=caseta({x:560,y:900,w:480,col:"#1f6e5a",pais:"TÚ",hora:"7,32€",persona:"feliz",fondo:"#3b1d66",ropa:"#c0392b"});
  if(lt>1.6) h+=`<div class="dato" style="left:360px;top:1560px;background:#d8ff1f;color:#1a0b33;transform:scale(${eb(sg(lt,1.6,1.9))})">−67,67 €</div>`;
 } else { // cierre con el globo
  cv.style.display="block"; const lt=t-34.1;
