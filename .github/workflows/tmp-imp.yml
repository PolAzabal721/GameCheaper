name: tmp-imp
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    env:
      ISID: ${{ secrets.IMPACT_ACCOUNT_SID }}
      ITOK: ${{ secrets.IMPACT_AUTH_TOKEN }}
    steps:
      - run: |
          S=$(printf '%s' "$ISID" | tr -d '[:space:]'); T=$(printf '%s' "$ITOK" | tr -d '[:space:]')
          echo "SID empieza por ${S:0:2}, ${#S} letras; token ${#T} letras; caracteres no alfanuméricos del token: $(printf '%s' "$T" | tr -d 'A-Za-z0-9' | sed 's/./&/g' | fold -w1 | sort -u | tr -d '\n')"
          for e in "" Campaigns Actions "Reports"; do printf "%s: " "${e:-raíz}"; curl -s -o /tmp/r -w '%{http_code}' -u "$S:$T" -H "Accept: application/json" "https://api.impact.com/Mediapartners/$S/$e"; echo " $(head -c 150 /tmp/r)"; done
