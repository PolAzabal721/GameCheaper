name: tmp-apis
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.PANEL_TOKEN }}
        run: |
          K=$(printf '%s' "$K" | tr -d '[:space:]'); echo "token panel: ${#K} letras"
          [ -n "$K" ] && curl -s "https://pillao-buscador.pillao-bb5842.workers.dev/ganancias?desde=2026-11-01&fresco=1&k=$K" | jq -c '{redes: [.redes[] | {red, estado, msg, n: ((.filas // []) | length), eur: ([(.filas // [])[] | .eur] | add)}], mano: (.mano | length)}'
