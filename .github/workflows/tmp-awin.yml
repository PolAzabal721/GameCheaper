name: tmp-awin
on: workflow_dispatch
permissions: { contents: read }
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env: { F: "${{ secrets.AWIN_TODOCONSOLAS_FEED }}" }
        run: |
          [ -n "$F" ] || { echo "SIN SECRETO"; exit 0; }
          U=$(printf '%s' "$F" | tr -d '[:space:]')
          curl -sSL --max-time 300 -o f.bin -w "http %{http_code} %{size_download}\n" "$U" || true
          file f.bin
          (unzip -o -q f.bin -d x 2>/dev/null || (gunzip -c f.bin > x.csv 2>/dev/null && mkdir -p x && mv x.csv x/)) ; ls -la x 2>/dev/null
          C=$(ls x/* 2>/dev/null | head -1); [ -n "$C" ] || C=f.bin
          python3 - "$C" <<'P'
          import csv,sys,collections
          r=[x for x in csv.DictReader(open(sys.argv[1],encoding='utf-8',errors='replace')) if x['merchant_category']=='Videojuego']
          K=['product_name','search_price','store_price','rrp_price','delivery_cost','condition','product_type','merchant_product_category_path','merchant_product_second_category','in_stock','stock_status','pre_order','ean','brand_name','custom_1','custom_2','custom_3','keywords']
          for x in r[:12]: print({k:x[k][:80] for k in K})
          for k in ['condition','merchant_product_category_path','merchant_product_second_category','product_type','stock_status','in_stock','custom_1','custom_2']: print(k,collections.Counter(x[k] for x in r).most_common(15))
          P
