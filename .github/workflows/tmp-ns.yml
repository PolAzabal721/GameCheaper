name: tmp-ns
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://api.ec.nintendo.com/v1/price?country=US&lang=en&ids=70010000000086,70010000000692,70010000002182,70010000053336" | head -c 2000; echo
          curl -s -A "Mozilla/5.0" "https://www.nintendo.com/us/store/products/super-mario-bros-wonder-switch/" | grep -o '"nsuid":"[0-9]*"' | sort | uniq -c | head
          curl -s -A "Mozilla/5.0" "https://www.nintendo.com/us/store/products/super-mario-bros-wonder-switch/" | grep -o '"product":{"name":"[^"]*","sku":"[^"]*","nsuid":"[0-9]*"' | head -3
          curl -s -A "Mozilla/5.0" "https://www.nintendo.com/us/store/products/super-mario-bros-wonder-switch/" | grep -o '.\{120\}"nsuid".\{60\}' | head -3
