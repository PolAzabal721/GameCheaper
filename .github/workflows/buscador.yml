name: Desplegar buscador

on:
  push:
    branches: [main]
    paths: ["buscador/**", ".github/workflows/buscador.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Comprobar secretos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Quita espacios o saltos de línea que se cuelan al pegar el token
          T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]'); A=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          echo "::add-mask::$T"
          echo "CLOUDFLARE_API_TOKEN=$T" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=$A" >> $GITHUB_ENV
          CLOUDFLARE_API_TOKEN=$T; CLOUDFLARE_ACCOUNT_ID=$A
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan los secretos CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID"; exit 1
          fi

      - name: Preparar almacenamiento (KV) y subdominio workers.dev
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo "Comprobando token:"; curl -s -H "$H" "$API/tokens/verify" | jq -c '{success, errors, estado: .result.status}'
          LISTA=$(curl -s -H "$H" "$API/storage/kv/namespaces?per_page=100")
          echo "Listar KV:"; echo "$LISTA" | jq -c '{success, errors, n: (.result | length?)}'
          ID=$(echo "$LISTA" | jq -r '.result[]? | select(.title=="pillao-anadidos") | .id')
          if [ -z "$ID" ]; then
            CREAR=$(curl -s -X POST -H "$H" -H "Content-Type: application/json" -d '{"title":"pillao-anadidos"}' "$API/storage/kv/namespaces")
            echo "Crear KV:"; echo "$CREAR" | jq -c '{success, errors}'
            ID=$(echo "$CREAR" | jq -r '.result.id')
          fi
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "::error::No pude crear el espacio KV"; exit 1; }
          sed -i "s/__KV_ID__/$ID/" buscador/wrangler.toml
          SUB=$(curl -s -H "$H" "$API/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            SUB="pillao-$(echo $CLOUDFLARE_ACCOUNT_ID | cut -c1-6)"
            curl -s -X PUT -H "$H" -H "Content-Type: application/json" -d "{\"subdomain\":\"$SUB\"}" "$API/workers/subdomain" | jq -c '.success, .errors'
          fi
          echo "SUB=$SUB" >> $GITHUB_ENV

      - name: Desplegar
        working-directory: buscador
        run: npx --yes wrangler@4.86.0 deploy

      - name: Claves de eBay (si existen)
        working-directory: buscador
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          if [ -n "$EBAY_CLIENT_ID" ] && [ -n "$EBAY_CLIENT_SECRET" ]; then
            printf '%s' "$EBAY_CLIENT_ID" | tr -d '[:space:]' | npx --yes wrangler@4.86.0 secret put EBAY_CLIENT_ID
            printf '%s' "$EBAY_CLIENT_SECRET" | tr -d '[:space:]' | npx --yes wrangler@4.86.0 secret put EBAY_CLIENT_SECRET
          else
            echo "Sin claves de eBay: el buscador funcionará con Steam y Nintendo eShop."
          fi

      - name: Clave de IsThereAnyDeal (si existe)
        working-directory: buscador
        env:
          ITAD_KEY: ${{ secrets.ITAD_KEY }}
        run: |
          if [ -n "$ITAD_KEY" ]; then printf '%s' "$ITAD_KEY" | tr -d '[:space:]' | npx --yes wrangler@4.86.0 secret put ITAD_KEY; else echo "Sin clave de IsThereAnyDeal."; fi

      - name: Avisos por email con Brevo (si existe la clave)
        working-directory: buscador
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          AVISOS_REMITENTE: ${{ secrets.AVISOS_REMITENTE }}
        run: |
          if [ -n "$BREVO_API_KEY" ] && [ -n "$AVISOS_REMITENTE" ]; then
            printf '%s' "$BREVO_API_KEY" | tr -d '[:space:]' | npx --yes wrangler@4.86.0 secret put BREVO_API_KEY
            printf '%s' "$AVISOS_REMITENTE" | tr -d '[:space:]' | npx --yes wrangler@4.86.0 secret put AVISOS_REMITENTE
          else
            echo "Sin BREVO_API_KEY / AVISOS_REMITENTE: la web enseñará la gráfica, pero los avisos por email quedan desactivados."
          fi

      - name: Probar y guardar la dirección del buscador
        run: |
          URL="https://pillao-buscador.$SUB.workers.dev"
          sleep 10
          curl -s "$URL/buscar?q=hollow%20knight" | head -c 600; echo
          echo "Historial de PC:"; curl -s "$URL/historial?titulo=Hades" | head -c 400; echo
          echo "Avisos:"; curl -s "$URL/avisos/estado?ids=x"; echo
          printf '{ "url": "%s" }\n' "$URL" > config/buscador.json
          git config user.name "pillao-bot"
          git config user.email "pillao-bot@users.noreply.github.com"
          git checkout -- buscador/wrangler.toml
          git add config/buscador.json
          git diff --cached --quiet && exit 0
          git commit -m "Dirección del buscador en vivo"
          git pull --rebase origin main
          git push
