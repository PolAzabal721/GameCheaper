name: prueba3
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        feed: [14267, 14280, 14281, 14282, 14283, 14284, 14285, 15830]
    steps:
      - env:
          F: ${{ secrets.ALIEXPRESS_FEED }}
        run: |
          U=$(echo "$F" | sed "s/feed_id=[0-9]*/feed_id=${{ matrix.feed }}/")
          cat > a.py <<'P'
          import sys,csv,re,collections
          csv.field_size_limit(10**9)
          r=csv.reader(sys.stdin, delimiter=';'); cab=next(r)
          PLAT=re.compile(r'\b(ps5|ps4|playstation ?[45]|nintendo switch|switch ?2|switch oled|xbox series|xbox one)\b',re.I)
          ACC=re.compile(r'controller|gamepad|joystick|case|bag|cover|skin|sticker|charger|charging|cable|stand|holder|grip|protector|glass|film|dock|fan|cool|battery|thumb|cap|button|shell|housing|repair|replacement|adapter|hdmi|ssd|memory|headset|earphone|keyboard|mouse|strap|wheel|pedal|light|led|mat|organizer|storage|rack|wall|mount|tool|screw|chip|board|motor|power|port',re.I)
          n=0; hits=collections.Counter(); ej=collections.defaultdict(list); encontrado=False
          for row in r:
            n+=1; d=dict(zip(cab,row)); nom=d.get('name','')
            if d.get('id')=='1005010084979022' or '1005010084979022' in d.get('url',''): print('ENCONTRADO', nom, d.get('price'), d.get('category')); encontrado=True
            if PLAT.search(nom) and not ACC.search(nom):
              c=d.get('category',''); hits[c]+=1
              if len(ej[c])<10: ej[c].append((nom[:110], d.get('price')))
          print('TOTAL',n,'ENCONTRADO' if encontrado else 'NO_ESTA_EL_DEL_ENLACE')
          print('CATS',hits.most_common(20))
          for c,_ in hits.most_common(8):
            for e in ej[c]: print('E',c,'|',e)
          P
          curl -sL "$U" | python3 a.py 2>&1 | sed "s/^/[${{ matrix.feed }}] /" | cut -c1-450
