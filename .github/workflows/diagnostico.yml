name: Diagnóstico tiendas
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://github.com/PolAzabal721/GameCheaper)"
          echo "=== Alcampo robots completo (User-agent *)"; curl -s -m 20 -A "$UA" https://www.compraonline.alcampo.es/robots.txt | head -40
          curl -s -m 20 -A "$UA" "https://www.compraonline.alcampo.es/search?q=nintendo%20switch%20juego" -o /tmp/a.html
          echo "=== Alcampo búsqueda: $(wc -c < /tmp/a.html) bytes"; grep -o -i -E 'captcha|cf-chl|access denied|akamai|blocked' /tmp/a.html | sort | uniq -c
          grep -o -E '"name":"[^"]{5,90}","[^}]{0,300}"price":\{[^}]{0,120}' /tmp/a.html | head -5
          grep -o -E 'window\.__[A-Z_]+__' /tmp/a.html | sort -u | head
          grep -o -E '[^>]{0,80}(Zelda|Mario|Switch)[^<]{0,80}' /tmp/a.html | head -8
          echo "=== xtralife robots"; curl -s -m 20 -A "$UA" https://www.xtralife.com/robots.txt | head -30
          echo "=== xtralife sitemap"; curl -s -m 20 -A "$UA" https://www.xtralife.com/sitemap.xml | head -c 1500; echo
