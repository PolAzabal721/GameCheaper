name: Diagnóstico xtralife
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://github.com/PolAzabal721/GameCheaper)"
          echo "=== robots de api.xtralife.com → $(curl -s -m 20 -A "$UA" -o /tmp/r -w '%{http_code}' https://api.xtralife.com/robots.txt)"; head -c 600 /tmp/r; echo
          for u in "https://api.xtralife.com/public-api/v1/sku?storefront_id=1&id=108287" "https://api.xtralife.com/public-api/v1/sku/offer?storefront_id=1&id=108287"; do
            echo "=== $u → $(curl -s -m 20 -A "$UA" -H 'Accept: application/json' -o /tmp/j -w '%{http_code}' "$u") $(wc -c < /tmp/j) bytes"
            jq -c 'if type=="object" then (.data // .) else . end | (if type=="object" then with_entries(select(.key|test("name|title|price|stock|available|platform|edition|sku|id|ean|status|offer|amount|currency|url|slug";"i"))) else .[0] end)' /tmp/j | head -c 1800; echo
            sleep 2
          done
