name: Diagnóstico xtralife
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://github.com/PolAzabal721/GameCheaper)"
          echo "=== robots completo"; curl -s -m 20 -A "$UA" https://www.xtralife.com/robots.txt | grep -v "^#" | grep -v "^$"
          for s in https://www.xtralife.com/sitemap.xml https://www.xtralife.com/sitemap_index.xml https://www.xtralife.com/sitemaps/sitemap.xml https://edge-cache.xtralife.com/sitemap.xml; do echo "=== $s → $(curl -s -m 20 -A "$UA" -o /tmp/s -w '%{http_code}' $s) $(head -c 300 /tmp/s | tr -d '\n')"; done
          U="https://www.xtralife.com/producto/atari-50-the-anniversary-celebration-edicion-expandida-ps5-estandar/90567"
          echo "=== ficha → $(curl -s -m 20 -A "$UA" -o /tmp/p.html -w '%{http_code}' "$U") $(wc -c < /tmp/p.html) bytes"
          grep -o -E '"price"[^,]{0,30}|itemprop="price"[^>]{0,80}|"@type":"Product"|application/ld\+json' /tmp/p.html | head -6
          echo "=== portada → $(curl -s -m 20 -A "$UA" -o /tmp/h.html -w '%{http_code}' https://www.xtralife.com/) $(wc -c < /tmp/h.html) bytes, enlaces de producto: $(grep -o '/producto/[^"]*' /tmp/h.html | sort -u | wc -l)"
          grep -o 'href="/[a-z0-9-]*/[^"]*"' /tmp/h.html | grep -v producto | sort -u | head -15
