name: Diagnóstico xtralife
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://github.com/PolAzabal721/GameCheaper)"
          curl -s -L -m 30 -A "$UA" https://www.xtralife.com/producto/007-first-light-edicion-legacy/108287 -o /tmp/p.html
          echo "=== scripts:"; grep -o -E '<script[^>]*src="[^"]+"' /tmp/p.html | head; grep -o -E 'https?://[a-z0-9.-]*xtralife[a-z0-9.-]*' /tmp/p.html | sort -u
          for js in $(grep -o -E 'src="[^"]+\.js"' /tmp/p.html | sed 's/src="//;s/"$//' | head -6); do
            case "$js" in http*) u="$js";; //*) u="https:$js";; *) u="https://www.xtralife.com/${js#/}";; esac
            curl -s -m 30 -A "$UA" "$u" -o /tmp/j.js; echo "--- $u ($(wc -c < /tmp/j.js) bytes)"
            grep -o -E 'https?://[a-z0-9.-]*(api|backend|services?)[a-z0-9.-]*\.[a-z]{2,}[a-zA-Z0-9/_.-]{0,40}' /tmp/j.js | sort -u | head -8
            grep -o -E '"/?(api|v[0-9])/[a-zA-Z0-9/_{}.-]{3,60}' /tmp/j.js | sort -u | grep -i -E 'product|producto|item|price' | head -10
          done
