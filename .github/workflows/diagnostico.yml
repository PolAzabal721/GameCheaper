name: Diagnóstico Brevo
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar clave y remitentes de Brevo (sin enviar nada)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          AVISOS_REMITENTE: ${{ secrets.AVISOS_REMITENTE }}
        run: |
          K=$(printf '%s' "$BREVO_API_KEY" | tr -d '[:space:]'); echo "::add-mask::$K"
          R=$(printf '%s' "$AVISOS_REMITENTE" | tr -d '[:space:]')
          echo "Clave: empieza por ${K:0:7}… (${#K} caracteres)"
          echo "--- Cuenta:"; curl -s -H "api-key: $K" -H "Accept: application/json" https://api.brevo.com/v3/account | jq -c '{code, message, plan: [.plan[]? | {type, credits}]}'
          echo "--- Remitentes:"; curl -s -H "api-key: $K" -H "Accept: application/json" https://api.brevo.com/v3/senders | jq -c --arg r "$R" '.code, .message, (.senders[]? | {coincide_con_el_secreto: (.email == $r), name, active})'
