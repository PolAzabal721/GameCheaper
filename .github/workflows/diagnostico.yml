name: Diagnóstico xtralife
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://github.com/PolAzabal721/GameCheaper)"
          curl -s -m 30 -A "$UA" https://static.xtralife.com/sitemap.xml -o /tmp/s.xml; echo "=== sitemap: $(wc -c < /tmp/s.xml) bytes"; head -c 1200 /tmp/s.xml; echo
          for sm in $(grep -o '<loc>[^<]*</loc>' /tmp/s.xml | sed 's/<[^>]*>//g' | head -8); do curl -s -m 30 -A "$UA" "$sm" -o /tmp/x; echo "--- $sm: $(wc -c < /tmp/x) bytes, URLs: $(grep -c '<loc>' /tmp/x), producto: $(grep -c '/producto/' /tmp/x)"; grep -o '<loc>[^<]*producto[^<]*</loc>' /tmp/x | head -3; sleep 2; done
          U=$(grep -o '/producto/[^"]*' /tmp/s.xml | head -1); [ -z "$U" ] && U="/producto/atari-50-the-anniversary-celebration-edicion-expandida-ps5-estandar/90567"
          curl -s -L -m 30 -A "$UA" "https://www.xtralife.com/producto/battlefield-6-ps5-estandar/129393" -o /tmp/p.html -w "=== ficha → %{http_code} %{url_effective}\n"
          echo "$(wc -c < /tmp/p.html) bytes"
          grep -o -E 'application/ld\+json[^<]{0,600}' /tmp/p.html | head -2
          grep -o -E '"(price|lowPrice|priceCurrency|availability|sku|gtin13)"\s*:\s*"?[^,"}]{0,40}' /tmp/p.html | head -10
          grep -o -E 'og:(title|price:amount)" content="[^"]*' /tmp/p.html | head -4
