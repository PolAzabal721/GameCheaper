name: Diagnóstico xtralife
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://github.com/PolAzabal721/GameCheaper)"
          curl -s -m 60 -A "$UA" https://static.xtralife.com/sitemapproducts-1.xml -o /tmp/x
          echo "=== estructura de una entrada:"; grep -o '<url>.\{0,900\}' /tmp/x | head -1
          echo "=== total productos en los 5 mapas:"; T=0; for i in 1 2 3 4 5; do curl -s -m 60 -A "$UA" https://static.xtralife.com/sitemapproducts-$i.xml -o /tmp/y; N=$(grep -o '<loc>https://www.xtralife.com/producto/' /tmp/y | wc -l); T=$((T+N)); echo "  $i: $N"; sleep 2; done; echo "  total $T"
          for U in https://www.xtralife.com/producto/007-first-light-edicion-legacy/108287 https://www.xtralife.com/producto/rollercoaster-tycoon-adventures-deluxe/80591; do
            curl -s -L -m 30 -A "$UA" "$U" -o /tmp/p.html -w "=== ficha → %{http_code} %{url_effective} %{size_download} bytes\n"
            grep -o -E '<script type="application/ld\+json">.{0,900}' /tmp/p.html | head -2
            grep -o -E '"(price|lowPrice|highPrice|priceCurrency|availability|gtin13|sku|platform|name)"\s*:\s*"?[^,"}]{0,60}' /tmp/p.html | sort -u | head -14
            grep -o -E '(og|product):[a-z:_]+" content="[^"]*' /tmp/p.html | head -6
            sleep 3
          done
