name: Diagnóstico tiendas
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://github.com/PolAzabal721/GameCheaper)"
          for u in "https://www.compraonline.alcampo.es/search?q=zelda" "https://www.compraonline.alcampo.es/api/webproductpagews/v5/product-pages/search?term=zelda&maxProductsToDecorate=10&maxPageSize=10" "https://www.compraonline.alcampo.es/api/webproductpagews/v6/product-pages/search?includeAdditionalPageInfo=true&maxPageSize=10&maxProductsToDecorate=10&q=zelda"; do
            C=$(curl -s -m 30 -A "$UA" -H "Accept: application/json,text/html" -o /tmp/a -w "%{http_code} %{content_type}" "$u"); echo "=== $u → $C, $(wc -c < /tmp/a) bytes"
            head -c 600 /tmp/a | tr -d '\n'; echo
            grep -o -E '"(name|title)":"[^"]{4,90}"' /tmp/a | head -6 | tr '\n' ' '; echo
            grep -o -E '"(amount|price|current)"[^,}]{0,40}' /tmp/a | head -6 | tr '\n' ' '; echo
            sleep 3
          done
          echo "=== sitemap index"; curl -s -m 30 -A "$UA" https://compraonline.alcampo.es/sitemaps/sitemap_index.xml | head -c 800; echo
