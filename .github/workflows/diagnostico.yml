name: Diagnóstico Alcampo
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://github.com/PolAzabal721/GameCheaper)"
          B=https://www.compraonline.alcampo.es
          echo "=== categorías de videojuegos"; curl -s -m 30 -A "$UA" $B/sitemaps/sitemap-categories-part1.xml | grep -o '<loc>[^<]*</loc>' | grep -i -E 'videojuego|consola|nintendo|playstation|xbox|gaming' | head -20
          for q in "nintendo switch" "ps5" "mario"; do
            echo "=== v6 q=$q"; curl -s -m 30 -A "$UA" -H "Accept: application/json" "$B/api/webproductpagews/v6/product-pages/search?includeAdditionalPageInfo=true&maxPageSize=20&maxProductsToDecorate=20&q=$(echo $q | sed 's/ /%20/g')" -o /tmp/s.json
            jq -c '{grupos: (.productGroups|length), primeros: [.productGroups[]?.decoratedProducts[]? | {name, price: .price, retailerProductId, brand}][0:4], claves: (.productGroups[0] // {} | keys)}' /tmp/s.json | head -c 1500; echo
            sleep 3
          done
          echo "=== página de búsqueda: estado incrustado"; curl -s -m 30 -A "$UA" "$B/search?q=nintendo%20switch" -o /tmp/p.html
          grep -o -E 'window\.__[A-Za-z_]+__ ?=' /tmp/p.html | sort -u; grep -o -E '<script[^>]*id="[^"]+"' /tmp/p.html | sort -u | head
          grep -o -E '"name":"[^"]{6,80}"[^{}]{0,200}"price"[^{}]{0,200}' /tmp/p.html | head -5
