name: Vídeos de los chollos

# Una vez al día hace vídeos verticales (TikTok y Reels) de los chollos publicados en Telegram.
# Quedan en videos/ y se pueden descargar en https://pillaojuegos.com/videos/
on:
  schedule:
    - cron: "41 8 * * *"   # 9:41 (hora de España)
  workflow_dispatch:
    inputs:
      maximo:
        description: "Cuántos vídeos hacer"
        default: "5"

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Preparar el navegador
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Hacer los vídeos
        env:
          VIDEOS_MAX: ${{ inputs.maximo || '5' }}
          VIDEOS_TELEGRAM: ${{ vars.VIDEOS_TELEGRAM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: node scripts/videos.mjs
      - name: Dejarlos descargables aquí mismo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: videos
          path: videos/*.mp4
          if-no-files-found: ignore
      - name: Guardarlos en la web
        run: |
          git config user.name "pillao-bot"
          git config user.email "pillao-bot@users.noreply.github.com"
          git add -A videos
          git diff --cached --quiet && exit 0
          git commit -m "Vídeos de los chollos de hoy"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
