name: Vídeos de los chollos

# Una vez al día hace vídeos verticales (TikTok y Reels) de los chollos publicados en Telegram.
# Quedan en videos/ y se pueden descargar en https://pillaojuegos.com/videos/
on:
  schedule:
    - cron: "41 8 * * *"   # 9:41 (hora de España)
  workflow_dispatch:
    inputs:
      juegos:
        description: "Juegos concretos de los que grabar (separados por comas); si se deja vacío, los de mayor descuento"
        required: false
      maximo:
        description: "Cuántos vídeos hacer"
        default: "5"

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Preparar ffmpeg
        # Los servidores de Ubuntu fallan de vez en cuando: se reintenta antes de darse por vencido
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && exit 0
            echo "Reintento $i…"; sleep 20
          done
          exit 1
      - name: Preparar la voz
        if: vars.VIDEOS_VOZ == '1'
        run: |
          python3 -m pip install --quiet piper-tts
          mkdir -p voz
          python3 -m piper.download_voices es_ES-davefx-medium --download-dir voz
          echo "Hola, esto es una prueba." | python3 -m piper -m es_ES-davefx-medium --data-dir voz -f voz/prueba.wav
          ls -la voz
      - name: Preparar el navegador y HyperFrames
        # Playwright instala las librerías del sistema que necesita el navegador; HyperFrames hace el vídeo a partir del HTML
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm install -g hyperframes
          hyperframes --version
      - name: Hacer los vídeos
        env:
          VIDEOS_MAX: ${{ inputs.maximo || '5' }}
          VIDEOS_JUEGOS: ${{ inputs.juegos }}
          VIDEOS_VOZ: ${{ vars.VIDEOS_VOZ }}
          HYPERFRAMES_SKIP_SKILLS: "1"
          PIPER_CMD: python3 -m piper
          PIPER_VOZ: es_ES-davefx-medium
          PIPER_DIR: voz
          VIDEOS_TELEGRAM: ${{ vars.VIDEOS_TELEGRAM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: node scripts/videos.mjs
      - name: Dejarlos descargables aquí mismo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: videos
          path: |
            videos/*.mp4
            videos/*-guiones.txt
          if-no-files-found: ignore
      - name: Guardarlos en la web
        run: |
          git config user.name "pillao-bot"
          git config user.email "pillao-bot@users.noreply.github.com"
          rm -rf voz
          git add -A videos data/videos.json
          git diff --cached --quiet && exit 0
          git commit -m "Vídeos de los chollos de hoy"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
