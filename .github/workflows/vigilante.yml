name: Vigilar las actualizaciones de precios
# GitHub a veces se salta las ejecuciones programadas (cuando tiene mucha cola). Cada hora se mira cuándo empezó
# la última actualización de precios; si hace más de 6 h y 30 min y no hay ninguna en marcha ni esperando, se lanza una.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lanzar la actualización si se ha saltado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          activas=$(gh run list -R "$REPO" -w actualizar-precios.yml -L 10 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$activas" != "0" ]; then echo "Hay $activas en marcha o esperando: no hace falta"; exit 0; fi
          ultima=$(gh run list -R "$REPO" -w actualizar-precios.yml -L 1 --json createdAt -q '.[0].createdAt')
          edad=$(( $(date +%s) - $(date -d "$ultima" +%s) ))
          echo "La última empezó hace $((edad / 60)) min"
          if [ $edad -gt 23400 ]; then
            gh workflow run actualizar-precios.yml -R "$REPO" --ref main
            echo "::warning::Se ha lanzado una actualización porque la programada no había salido"
          fi
