name: Prueba temporal CJ (K4G)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
        run: |
          python3 scripts/cj_catalogo.py 5923171 k4g.json
          python3 -c "
          import json,re,collections;d=json.load(open('k4g.json'));print(len(d))
          reg=collections.Counter((re.search(r'-(europe|eu|global|worldwide|spain|emea|latam|us|row|turkey|india|argentina|asia|uk|russia|cis|brazil|north-america|united-states)-',x['l']) or [None,'?'])[1] for x in d);print(reg.most_common(20))
          for x in d[:6]: print(x['n'],'|',x['p'],'|',x['l'])"
