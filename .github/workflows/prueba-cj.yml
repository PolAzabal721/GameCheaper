name: Prueba temporal CJ (GamersGate)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Programa de GamersGate en CJ y consultas de productos disponibles
        env:
          T: ${{ secrets.CJ_TOKEN }}
        run: |
          echo "== Campos de un producto"
          curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"query":"{ __type(name: \"Product\") { fields { name args { name } } } }"}' https://ads.api.cj.com/query | head -c 3000; echo
          echo "== 3 productos de GamersGate (2821123)"
          curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"query":"{ products(companyId: \"8127571\", partnerIds: [\"2821123\"], limit: 3) { totalCount count resultList { id title price { amount currency } link imageLink availability targetCountry } } }"}' https://ads.api.cj.com/query | head -c 3000; echo
