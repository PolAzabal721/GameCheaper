name: Prueba temporal CJ (K4G)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Productos de K4G sin estar unido
        env:
          T: ${{ secrets.CJ_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"query":"{ products(companyId: \"8127571\", partnerIds: [\"5923171\"], partnerStatus: NOT_JOINED, limit: 3) { totalCount count resultList { title catalogName targetCountry price { amount currency } link } } }"}' https://ads.api.cj.com/query | head -c 2500; echo
          curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"query":"{ products(companyId: \"8127571\", partnerIds: [\"5923171\"], partnerStatus: NOT_JOINED, currency: \"EUR\", limit: 1) { totalCount } }"}' https://ads.api.cj.com/query; echo
