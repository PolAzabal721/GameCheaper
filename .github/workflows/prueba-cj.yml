name: Prueba temporal CJ (GamersGate)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Catálogo de GamersGate por CJ
        env:
          CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
        run: |
          python3 scripts/gamersgate_cj.py gg.json
          python3 -c "import json,collections;d=json.load(open('gg.json'));print(len(d));print(collections.Counter(x['t'] or 'juego' for x in d));print(sum(1 for x in d if x['p']<x['r']),'rebajados');print(json.dumps(d[:2],ensure_ascii=False))"
