name: Prueba temporal CJ (GamersGate)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Catálogos de GamersGate en CJ y enlace con el PID
        env:
          T: ${{ secrets.CJ_TOKEN }}
        run: |
          q() { curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$1" https://ads.api.cj.com/query; echo; }
          echo "== EUR: total y 3 de muestra con enlace de afiliado"
          q '{"query":"{ products(companyId: \"8127571\", partnerIds: [\"2821123\"], currency: \"EUR\", limit: 3) { totalCount count resultList { id title catalogName targetCountry price { amount currency } link linkCode(pid: \"101929112\") { clickUrl } } } }"}' | head -c 3000
          echo "== Nombres de catálogo (muestra de 1000 productos EUR)"
          q '{"query":"{ products(companyId: \"8127571\", partnerIds: [\"2821123\"], currency: \"EUR\", limit: 1000) { count resultList { catalogName targetCountry } } }"}' > m.json
          python3 -c "import json,collections;d=json.load(open('m.json'));r=d['data']['products']['resultList'];print(len(r),collections.Counter((x['catalogName'],x['targetCountry']) for x in r))" || head -c 500 m.json
          echo "== Página siguiente (paginación)"
          q '{"query":"{ products(companyId: \"8127571\", partnerIds: [\"2821123\"], currency: \"EUR\", limit: 2, offset: 2) { count resultList { id } } }"}' | head -c 600
