name: prueba-kinguin
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kinguin-uk-eur
          run-id: 44078678228
          github-token: ${{ github.token }}
      - run: |
          gunzip -f kinguin-uk-eur.csv.gz
          cat > a.py <<'P'
          import csv,re,collections,json,unicodedata
          csv.field_size_limit(10**9)
          F=list(csv.DictReader(open('kinguin-uk-eur.csv',newline='',encoding='utf-8',errors='replace'),delimiter=';'))
          PLAT={'Steam':'PC','GOG.com':'PC','EA App':'PC','Epic Games':'PC','Ubisoft':'PC','Battle.net':'PC','Rockstar Games':'PC','MS Store (PC)':'PC','PC':'PC','Xbox One':'Xbox Series','Xbox Series X|S':'Xbox Series','PlayStation 4':'PS4','PlayStation 5':'PS5','Nintendo Switch':'Switch','Nintendo Switch 2':'Switch 2'}
          motivos=collections.Counter(); ok=[]
          for x in F:
            c=x['categoryId']; n=x['name']
            if c not in ('GAME','DLC','PREORDER'): motivos['categoria '+c]+=1; continue
            if re.search(r'\baccount\b|altergift|\bgift\b(?! card)',n,re.I): motivos['cuenta o regalo']+=1; continue
            if re.search(r'(^|,)ES(,|$)',x.get('country_limitations','')): motivos['no vale en España']+=1; continue
            pl=PLAT.get(x['platform']); 
            if not pl: motivos['plataforma '+x['platform']]+=1; continue
            ok.append((x,pl))
          print('VALIDAS',len(ok)); print('DESCARTES',motivos.most_common(15))
          print('POR PLATAFORMA',collections.Counter(p for _,p in ok).most_common())
          d=json.load(open('precios.json'))
          def llave(s): s=unicodedata.normalize('NFKD',s.lower()); s=re.sub(r'[^a-z0-9]+',' ',s); return ' '.join(w for w in s.split() if w not in ('the','edition','standard'))
          steam={}; tit={}
          for j in d['juegos']:
            c=(j.get('cov') or j.get('img') or '')
            m=re.match(r'sc?:(\d+)',c)
            if m: steam[m.group(1)]=j['titulo']
            tit[llave(j['titulo'])]=j['titulo']
          COLA=re.compile(r'\s*\b(pc|ps4|ps5|playstation( [45])?|xbox( (one|series( x\|s| x s)?|live))?|nintendo( switch( 2)?)?|switch( 2)?|steam|epic games?|ea app|origin|uplay|ubisoft connect|gog|battle ?net|rockstar( games| digital download)?|microsoft( store)?|windows( 10| 11)?|global|eu|emea|europe|row|us|uk|na|ar|latam|cd key|key|digital download|windows 10|dlc)\b',re.I)
          porS=porN=0; nuevos=[]
          for x,pl in ok:
            if x.get('steam_id') and x['steam_id'] in steam: porS+=1; continue
            t=re.sub(r'\s*/\s*',' ',x['name']); t=COLA.sub(' ',t); t=re.sub(r'\s+',' ',t).strip(' -')
            if llave(t) in tit: porN+=1
            else: nuevos.append(t)
          print('CASAN POR STEAM_ID',porS,'POR NOMBRE',porN,'NO ESTAN EN PILLAO',len(nuevos))
          for t in nuevos[:15]: print('N',t[:80])
          P
          python3 a.py 2>&1 | cut -c1-700
