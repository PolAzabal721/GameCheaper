name: prueba-kinguin
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kinguin-uk-eur
          run-id: 44078678228
          github-token: ${{ github.token }}
      - run: |
          gunzip -f kinguin-uk-eur.csv.gz
          cat > a.py <<'P'
          import csv,re,collections,random
          csv.field_size_limit(10**9)
          r=csv.DictReader(open('kinguin-uk-eur.csv',newline='',encoding='utf-8',errors='replace'),delimiter=';')
          F=list(r); print('TOTAL',len(F))
          for k in ['categoryId','region','platform','type','delivery_type','available','vendor','steam_type']:
            print('V',k,collections.Counter(x.get(k,'')[:40] for x in F).most_common(25))
          cl=[x for x in F if x.get('country_limitations')]; print('CON LIMITACIONES',len(cl))
          es_bloq=sum(1 for x in cl if re.search(r'(^|,)ES(,|$)',x['country_limitations'])); print('LIMITACIONES QUE INCLUYEN ES',es_bloq)
          print('URL EJEMPLO',re.sub(r'code=[a-z0-9]+','code=XXX',F[5]['url'])[:300])
          G=[x for x in F if x.get('categoryId')=='GAME']
          ok=[x for x in G if not re.search(r'account|altergift',x['name'],re.I)]
          print('JUEGOS (GAME)',len(G),'sin cuentas ni altergift',len(ok))
          print('REGION JUEGOS',collections.Counter(x.get('region','') for x in ok).most_common(20))
          random.seed(5)
          for x in random.sample(ok,15): print('J',x['name'][:80],'|',x['price'],'|',x.get('region'),'|',x.get('platform'),'|',x.get('country_limitations','')[:60])
          P
          python3 a.py 2>&1 | cut -c1-700
