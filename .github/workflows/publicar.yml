name: Publicar web

# Construye la web con una página por juego (para que Google las encuentre) y la publica en GitHub Pages.
# Requiere: Settings → Pages → Build and deployment → Source: «GitHub Actions».
on:
  push:
    branches: [main]
    paths-ignore: ["buscador/**", ".github/workflows/buscador.yml"]
  workflow_run:
    workflows: ["Actualizar precios"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Construir
        run: node scripts/paginas.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
