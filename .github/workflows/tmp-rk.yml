name: tmp-rk
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    env:
      CI: ${{ secrets.RAKUTEN_CLIENT_ID }}
      CS: ${{ secrets.RAKUTEN_CLIENT_SECRET }}
    steps:
      - run: |
          I=$(printf '%s' "$CI" | tr -d '[:space:]'); S=$(printf '%s' "$CS" | tr -d '[:space:]'); echo "id ${#I}, secreto ${#S}"
          B=$(printf '%s:%s' "$I" "$S" | base64 -w0)
          for g in "grant_type=client_credentials&scope=4779010" "grant_type=password&scope=4779010"; do
            R=$(curl -s -H "Authorization: Bearer $B" -H "Content-Type: application/x-www-form-urlencoded" -d "$g" https://api.linksynergy.com/token)
            echo "$g -> $(echo "$R" | jq -c 'del(.access_token,.refresh_token)' 2>/dev/null || echo "$R" | head -c 200)"
            A=$(echo "$R" | jq -r '.access_token // empty' 2>/dev/null); [ -n "$A" ] && break
          done
          [ -n "$A" ] && curl -s -w ' [%{http_code}]' -H "Authorization: Bearer $A" "https://api.linksynergy.com/events/1.0/transactions?process_date_start=2026-10-25%2000:00:00&process_date_end=2026-11-23%2023:59:59&limit=5" | head -c 800; echo
