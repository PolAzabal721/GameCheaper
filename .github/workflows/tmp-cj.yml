name: tmp-cj
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CJ_TOKEN }}
    steps:
      - run: |
          T=$(printf '%s' "$T" | tr -d '[:space:]')
          for C in EUR USD; do
          Q="{ products(companyId: \"8127571\", partnerIds: [\"6086371\"], partnerStatus: JOINED, keywords: [\"bully\"], currency: \"$C\", limit: 20) { totalCount resultList { title catalogName price { amount currency } link } } }"
          echo "== $C"; curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$(jq -n --arg q "$Q" '{query:$q}')" https://ads.api.cj.com/query | head -c 3000; echo; done
          Q='{ products(companyId: "8127571", partnerIds: ["6086371"], partnerStatus: JOINED, limit: 1) { totalCount } }'
          echo "== total"; curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$(jq -n --arg q "$Q" '{query:$q}')" https://ads.api.cj.com/query; echo
          Q='{ productFeeds(companyId: "8127571", advertiserIds: ["6086371"]) { totalCount resultList { adId feedName productCount currency lastUpdated } } }'
          echo "== feeds"; curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$(jq -n --arg q "$Q" '{query:$q}')" https://ads.api.cj.com/query; echo
