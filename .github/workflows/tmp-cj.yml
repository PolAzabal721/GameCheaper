name: tmp-cj
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CJ_TOKEN }}
    steps:
      - run: |
          T=$(printf '%s' "$T" | tr -d '[:space:]')
          echo "== anunciantes unidos"; curl -s -H "Authorization: Bearer $T" "https://advertiser-lookup.api.cj.com/v2/advertiser-lookup?requestor-cid=8127571&advertiser-ids=joined" | grep -oE '<advertiser-id>[0-9]+</advertiser-id>|<advertiser-name>[^<]*</advertiser-name>|<account-status>[^<]*</account-status>|<relationship-status>[^<]*</relationship-status>' | paste - - - - | head -20
          Y=$(curl -s -H "Authorization: Bearer $T" "https://advertiser-lookup.api.cj.com/v2/advertiser-lookup?requestor-cid=8127571&advertiser-ids=joined" | tr '\n' ' ' | grep -oE '<advertiser-id>[0-9]+</advertiser-id>[^<]*<advertiser-name>[^<]*[Yy]u[Pp]lay' | grep -oE '[0-9]+' | head -1)
          echo "Yuplay id: $Y"
          [ -n "$Y" ] || exit 0
          echo "== enlaces"; curl -s -H "Authorization: Bearer $T" "https://link-search.api.cj.com/v2/link-search?website-id=101929112&advertiser-ids=$Y&records-per-page=20" | grep -oE '<link-id>[0-9]+</link-id>|<link-name>[^<]*</link-name>|<link-type>[^<]*</link-type>|<destination>[^<]*</destination>' | paste - - - - | head -20
          echo "== productos"; Q="{ products(companyId: \"8127571\", partnerIds: [\"$Y\"], partnerStatus: JOINED, limit: 3) { totalCount resultList { title price { amount currency } link linkCode(pid: \"101929112\") { clickUrl } } } }"
          curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$(jq -n --arg q "$Q" '{query:$q}')" https://ads.api.cj.com/query | head -c 1500; echo
