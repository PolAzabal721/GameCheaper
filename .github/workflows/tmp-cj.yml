name: tmp-cj
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    env:
      U: ${{ secrets.RAKUTEN_FTP_USER }}
      P: ${{ secrets.RAKUTEN_FTP_PASS }}
    steps:
      - run: |
          U=$(printf '%s' "$U" | tr -d '[:space:]'); P=$(printf '%s' "$P" | tr -d '[:space:]')
          mkdir -p ~/.ssh && ssh-keyscan -T 20 aftp.linksynergy.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "== raiz"; curl -sS --max-time 60 -u "$U:$P" "sftp://aftp.linksynergy.com/" | awk '{print $NF}' | head -50
          for d in GLOBAL ADDITIONAL; do echo "== $d"; curl -sS --max-time 60 -u "$U:$P" "sftp://aftp.linksynergy.com/$d/" | awk '{print $NF}' | head -60; done
          for d in $(curl -sS --max-time 60 -u "$U:$P" "sftp://aftp.linksynergy.com/GLOBAL/" | awk '{print $NF}' | grep -v '^\.' ); do echo "== GLOBAL/$d"; curl -sS --max-time 60 -u "$U:$P" "sftp://aftp.linksynergy.com/GLOBAL/$d/" | awk '{print $NF}' | grep -v '^\.' | head -10; done
