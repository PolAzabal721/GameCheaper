name: Prueba2
on:
  workflow_dispatch:
jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Robots de las tiendas nuevas
        run: |
          node -e '
          const UA={"User-Agent":"Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)","Accept-Language":"es-ES,es;q=0.9"};
          const sitios=["https://www.amazon.es","https://keys4us.com","https://bitcodes.co","https://gameseal.com","https://www.bcdkey.com","https://keywrld.com","https://www.eldorado.gg","https://lootbar.gg","https://www.ldshop.gg","https://k4g.com","https://www.gamingdragons.com","https://www.hrkgame.com","https://www.pccomponentes.com","https://www.mediamarkt.es","https://www.gamivo.com","https://www.loaded.com"];
          (async()=>{
            for(const s of sitios){
              let rob="", st="?", home="?", len=0, mapas=[];
              try{ const r=await fetch(s+"/robots.txt",{headers:UA,redirect:"follow"}); st=r.status; rob=await r.text(); }catch(e){ st="ERR "+e.message.slice(0,40); }
              try{ const h=await fetch(s,{headers:UA,redirect:"follow"}); home=h.status; len=(await h.text()).length; }catch(e){ home="ERR "+e.message.slice(0,40); }
              const lineas=rob.split("\n").map(l=>l.trim());
              // reglas para «*»
              let enStar=false; const reglas=[];
              for(const l of lineas){ if(/^user-agent:/i.test(l)){ enStar=/user-agent:\s*\*\s*$/i.test(l); continue; } if(enStar&&/^(dis)?allow:/i.test(l)) reglas.push(l); }
              mapas=lineas.filter(l=>/^sitemap:/i.test(l)).slice(0,3);
              const todo=reglas.some(r=>/^disallow:\s*\/\s*$/i.test(r));
              console.log("### "+s+" | robots "+st+" | portada "+home+" ("+len+" b) | bloquea todo: "+(todo?"SI":"no")+" | reglas *: "+reglas.length);
              console.log("    "+reglas.slice(0,14).join(" · "));
              if(mapas.length) console.log("    "+mapas.join(" · "));
              await new Promise(r=>setTimeout(r,800));
            }
          })()'
