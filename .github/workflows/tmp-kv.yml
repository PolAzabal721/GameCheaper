name: tmp-kv
on: workflow_dispatch
jobs:
  apuntar:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          API="https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces"; H="Authorization: Bearer $T"
          ID=$(curl -s -H "$H" "$API?per_page=100" | jq -r '.result[] | select(.title=="pillao-anadidos") | .id')
          G=$(curl -s https://open.er-api.com/v6/latest/GBP | jq -r .rates.EUR); echo "1 GBP = $G EUR"
          # CJS CD Keys (panel de CJS, 23 nov): comisiones pendientes (30 días de espera), en libras
          for par in "2026-11-21 2.79" "2026-11-22 0.87"; do set -- $par
            E=$(python3 -c "print(round($2*$G,2))")
            curl -s -X PUT -H "$H" -F 'value=' -F "metadata={\"tienda\":\"cjs\",\"f\":\"$1\",\"eur\":$E,\"gbp\":$2,\"conf\":false}" "$API/$ID/values/g:cjs:$1" | jq -c '{success, errors}'
            echo "cjs $1: £$2 = $E €"
          done
