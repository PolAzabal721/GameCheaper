name: Logos de tiendas

# Descarga una vez el icono de cada tienda y lo guarda en logos/ (64 px, PNG), para servirlo desde nuestra web
# sin cargar nada de terceros. Prueba varias fuentes por si alguna no tiene el icono. Se lanza a mano al añadir tiendas.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Descargar iconos
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          mkdir -p logos tmp-logos
          node -e '
          const fs=require("fs"), { execFileSync }=require("child_process");
          const mapa=JSON.parse(fs.readFileSync("config/logos.json","utf8"));
          const UA={"User-Agent":"Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)"};
          const fuentes=(d)=>[
            "https://www.google.com/s2/favicons?domain="+d+"&sz=64",
            "https://icons.duckduckgo.com/ip3/"+d+".ico",
            "https://"+d+"/apple-touch-icon.png",
            "https://www."+d+"/apple-touch-icon.png",
            "https://"+d+"/favicon.ico",
            "https://www."+d+"/favicon.ico",
          ];
          (async()=>{
            for(const dom of [...new Set(Object.values(mapa))]){
              const dest="logos/"+dom.replace(/[^a-z0-9.-]/g,"")+".png";
              if(fs.existsSync(dest) && fs.statSync(dest).size>300){ continue; }
              let hecho=false;
              for(const u of fuentes(dom)){
                try{
                  const r=await fetch(u,{headers:UA,redirect:"follow"});
                  const b=Buffer.from(await r.arrayBuffer());
                  if(!r.ok || b.length<300) continue;
                  const tmp="tmp-logos/x";
                  fs.writeFileSync(tmp,b);
                  // a PNG de 64 px (vale para .ico, .png y .svg)
                  execFileSync("convert",[tmp+"[0]","-background","none","-resize","64x64","-gravity","center","-extent","64x64",dest]);
                  if(fs.statSync(dest).size>200){ console.log("ok   "+dom+" desde "+u); hecho=true; break; }
                }catch(e){}
              }
              if(!hecho) console.log("MAL  "+dom);
              await new Promise(r=>setTimeout(r,300));
            }
          })()'
          rm -rf tmp-logos
      - name: Guardar
        run: |
          git config user.name "pillao-bot"
          git config user.email "pillao-bot@users.noreply.github.com"
          git add logos
          git diff --cached --quiet && exit 0
          git commit -m "Logos de las tiendas"
          git pull --rebase origin main && git push
