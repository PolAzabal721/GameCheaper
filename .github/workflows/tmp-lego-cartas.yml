name: Probar los scripts de pillaoLegos y pillaoCartas (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    env:
      AWIN_TODOCONSOLAS_FEED: ${{ secrets.AWIN_TODOCONSOLAS_FEED }}
      TRADEDOUBLER_TOKEN: ${{ secrets.TRADEDOUBLER_TOKEN }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tmp }
      - run: |
          mkdir -p l/scripts c/scripts; cp tmp/legos.py l/scripts/actualizar.py; cp tmp/cartas.py c/scripts/actualizar.py
          python3 l/scripts/actualizar.py; python3 c/scripts/actualizar.py
          echo "@@@LEGOS"; cat l/datos/productos.json | python3 -c "import json,sys;print(json.dumps(json.load(sys.stdin),ensure_ascii=False))"; echo "@@@FIN"
          echo "@@@CARTAS"; cat c/datos/productos.json | python3 -c "import json,sys;print(json.dumps(json.load(sys.stdin),ensure_ascii=False))"; echo "@@@FIN"
