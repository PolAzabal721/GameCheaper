name: Actualizar precios

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Fecha de hoy
        id: hoy
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Catálogo de Kinguin (como mucho una descarga al día)
        id: cache-kinguin
        uses: actions/cache@v4
        with:
          path: |
            feeds/kinguin.json
            feeds/kinguin-latam.json
            feeds/kinguin-us.json
            feeds/kinguin-de.json
            feeds/kinguin-fr.json
          key: kinguin7-${{ steps.hoy.outputs.d }}
      - name: Descargar el catálogo de Kinguin (Admitad)
        if: steps.cache-kinguin.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          F: ${{ secrets.ALIEXPRESS_FEED }}
        run: |
          mkdir -p feeds
          U=$(printf '%s' "$F" | sed -E 's#/(en|es)/webmaster#/es/webmaster#; s/feed_id=[0-9]+/feed_id=25659/; s/&fcid=[0-9]+//')
          curl -sL --max-time 900 -o feeds/kinguin.csv "$U"
          python3 scripts/kinguin_feed.py feeds/kinguin.csv feeds/kinguin.json feeds/kinguin-latam.json feeds/kinguin-us.json feeds/kinguin-de.json feeds/kinguin-fr.json
          rm feeds/kinguin.csv
      - name: Catálogo de G2A (como mucho una descarga al día)
        id: cache-g2a
        uses: actions/cache@v4
        with:
          path: |
            feeds/g2a.json
            feeds/g2a-latam.json
            feeds/g2a-de.json
          key: g2a2-${{ steps.hoy.outputs.d }}
      - name: Descargar el catálogo de G2A (Admitad; Alemania en euros para España y México en pesos para Latinoamérica)
        if: steps.cache-g2a.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          F: ${{ secrets.ALIEXPRESS_FEED }}
        run: |
          mkdir -p feeds
          for par in "15446 feeds/g2a.json" "15444 feeds/g2a-latam.json latam"; do
            set -- $par
            U=$(printf '%s' "$F" | sed -E 's#/(en|es)/webmaster#/es/webmaster#; s/feed_id=[0-9]+/feed_id='$1'/; s/&fcid=[0-9]+//')
            curl -sL --max-time 900 -o feeds/g2a.csv "$U" && python3 scripts/g2a_feed.py feeds/g2a.csv $2 $3 || true
            # El catálogo de Alemania (15446) también sirve para pillaojuegos.com/de/
            [ "$1" = "15446" ] && [ -s feeds/g2a.csv ] && python3 scripts/g2a_feed.py feeds/g2a.csv feeds/g2a-de.json de || true
            rm -f feeds/g2a.csv
          done
      - name: Catálogo de GGPick (lo leemos de su web; como mucho una vez al día)
        id: cache-ggpick
        uses: actions/cache@v4
        with:
          path: feeds/ggpick.json
          key: ggpick-${{ steps.hoy.outputs.d }}
      - name: Leer GGPick
        if: steps.cache-ggpick.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/ggpick_feed.mjs
      - name: Catálogo de CJS CD Keys (como mucho una descarga al día)
        id: cache-cjs
        uses: actions/cache@v4
        with:
          path: |
            feeds/cjs.json
            feeds/cjs-latam.json
            feeds/cjs-us.json
            feeds/cjs-de.json
            feeds/cjs-fr.json
          key: cjs4-${{ steps.hoy.outputs.d }}
      - name: Descargar el catálogo de CJS CD Keys (feed público con nuestro enlace de afiliado)
        if: steps.cache-cjs.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p feeds
          # hasta 3 intentos: a veces corta la descarga a la primera
          for i in 1 2 3; do
            curl -sSL --retry 2 --max-time 400 -A "Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)" -o feeds/cjs.xml "https://www.cjs-cdkeys.com/autokey/productFeed/gocdkeysFeedRead.php?utm_source=pillao&utm_campaign=feed" || true
            ls -la feeds/cjs.xml || true
            python3 scripts/cjs_feed.py feeds/cjs.xml feeds/cjs.json feeds/cjs-latam.json feeds/cjs-us.json feeds/cjs-de.json feeds/cjs-fr.json && break
            sleep 30
          done
          rm -f feeds/cjs.xml
      - name: Descargar el catálogo de Todo Consolas (Awin)
        continue-on-error: true
        timeout-minutes: 8
        env:
          F: ${{ secrets.AWIN_TODOCONSOLAS_FEED }}
        run: |
          [ -n "$F" ] || exit 0
          mkdir -p feeds
          U=$(printf '%s' "$F" | tr -d '[:space:]')
          curl -sSL --retry 2 --max-time 300 -o feeds/todoconsolas.zip "$U" && python3 scripts/todoconsolas_feed.py feeds/todoconsolas.zip feeds/todoconsolas.json
          rm -f feeds/todoconsolas.zip
      - name: Descargar el catálogo de GamersGate para España (feed público con el enlace de afiliado)
        continue-on-error: true
        run: |
          mkdir -p feeds
          curl -sSL --max-time 300 -A "Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)" -o feeds/gamersgate.xml "https://feeds.gamersgate.com/feeds/products?country=ESP&aff=15600f04623a9a73fa267b81bfec59911a3e5263"
          python3 scripts/gamersgate_feed.py feeds/gamersgate.xml feeds/gamersgate.json
          rm feeds/gamersgate.xml
          curl -sSL --max-time 300 -A "Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)" -o feeds/gamersgate-usa.xml "https://feeds.gamersgate.com/feeds/products?country=USA&aff=15600f04623a9a73fa267b81bfec59911a3e5263" && python3 scripts/gamersgate_feed.py feeds/gamersgate-usa.xml feeds/gamersgate-usa.json || true
          rm -f feeds/gamersgate-usa.xml
          curl -sSL --max-time 300 -A "Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)" -o feeds/gamersgate-de.xml "https://feeds.gamersgate.com/feeds/products?country=DEU&aff=15600f04623a9a73fa267b81bfec59911a3e5263" && python3 scripts/gamersgate_feed.py feeds/gamersgate-de.xml feeds/gamersgate-de.json || true
          rm -f feeds/gamersgate-de.xml
      - name: Catálogo de Loaded (como mucho una descarga al día)
        id: cache-loaded
        uses: actions/cache@v4
        with:
          path: |
            feeds/loaded.json
            feeds/loaded-latam.json
            feeds/loaded-us.json
            feeds/loaded-de.json
            feeds/loaded-fr.json
          key: loaded5-${{ steps.hoy.outputs.d }}
      - name: Descargar el catálogo de Loaded (FTP de Impact, en euros y en español)
        if: steps.cache-loaded.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          U: ${{ secrets.LOADED_FTP_USER }}
          P: ${{ secrets.LOADED_FTP_PASS }}
        run: |
          mkdir -p feeds
          curl -sS --max-time 300 -u "$U:$P" -o feeds/loaded.xml.gz "ftp://products.impact.com/Loaded/Loaded-ProductFeedEURSpanish_CUSTOM.xml.gz"
          python3 scripts/loaded_feed.py feeds/loaded.xml.gz feeds/loaded.json
          python3 scripts/loaded_feed.py feeds/loaded.xml.gz feeds/loaded-de.json de || true
          python3 scripts/loaded_feed.py feeds/loaded.xml.gz feeds/loaded-fr.json fr || true
          rm feeds/loaded.xml.gz
          curl -sS --max-time 300 -u "$U:$P" -o feeds/loaded-usd.xml.gz "ftp://products.impact.com/Loaded/Loaded-ProductFeedUSDEnglish_CUSTOM.xml.gz" && python3 scripts/loaded_feed.py feeds/loaded-usd.xml.gz feeds/loaded-latam.json latam && python3 scripts/loaded_feed.py feeds/loaded-usd.xml.gz feeds/loaded-us.json us || true
          rm -f feeds/loaded-usd.xml.gz
      - name: Catálogo de Gamesporium (Admitad, como mucho una descarga al día)
        id: cache-gamesporium
        uses: actions/cache@v4
        with:
          path: |
            feeds/gamesporium.json
            feeds/gamesporium-usd.json
          key: gamesporium2-${{ steps.hoy.outputs.d }}
      - name: Descargar el catálogo de Gamesporium (Admitad)
        if: steps.cache-gamesporium.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          F: ${{ secrets.ALIEXPRESS_FEED }}
        run: |
          mkdir -p feeds
          U=$(printf '%s' "$F" | sed -E 's#/(en|es)/webmaster#/es/webmaster#; s/&fcid=[0-9]+//; s/feed_id=[0-9]+/feed_id=26878/')
          curl -sL --max-time 600 -o feeds/gamesporium.csv "$U"
          python3 scripts/gamesporium_feed.py feeds/gamesporium.csv feeds/gamesporium.json
          rm -f feeds/gamesporium.csv
          U=$(printf '%s' "$U" | sed -E 's/feed_id=[0-9]+/feed_id=26884/')   # el mismo catálogo en dólares (EE. UU. y LATAM)
          curl -sL --max-time 600 -o feeds/gamesporium-usd.csv "$U" && python3 scripts/gamesporium_feed.py feeds/gamesporium-usd.csv feeds/gamesporium-usd.json USD || true
          rm -f feeds/gamesporium-usd.csv
      - name: Catálogo de Voidu (Daisycon, como mucho una descarga al día)
        id: cache-voidu
        uses: actions/cache@v4
        with:
          path: feeds/voidu.json
          key: voidu1-${{ steps.hoy.outputs.d }}
      - name: Descargar el catálogo de Voidu (feed JSON de Daisycon, en euros)
        if: steps.cache-voidu.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          FEED: ${{ secrets.VOIDU_FEED }}
        run: |
          mkdir -p feeds
          F="$(printf '%s' "$FEED" | tr -d '[:space:]')"
          curl -sSL --max-time 300 -A "Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)" -o feeds/voidu-raw.json "$F"
          python3 scripts/voidu_feed.py feeds/voidu-raw.json feeds/voidu.json
          rm -f feeds/voidu-raw.json
      - name: Catálogo de Nuuvem (Rakuten, como mucho una descarga al día)
        id: cache-nuuvem
        uses: actions/cache@v4
        with:
          path: feeds/nuuvem.json
          key: nuuvem-${{ steps.hoy.outputs.d }}
      - name: Descargar el catálogo de Nuuvem (SFTP de Rakuten, en reales)
        if: steps.cache-nuuvem.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          U: ${{ secrets.RAKUTEN_FTP_USER }}
          P: ${{ secrets.RAKUTEN_FTP_PASS }}
        run: |
          [ -n "$U" ] || exit 0
          U=$(printf '%s' "$U" | tr -d '[:space:]'); P=$(printf '%s' "$P" | tr -d '[:space:]')
          mkdir -p feeds ~/.ssh && ssh-keyscan -T 20 aftp.linksynergy.com >> ~/.ssh/known_hosts 2>/dev/null
          # El archivo de Nuuvem (anunciante 46796) aparece en la carpeta de Brasil cuando Rakuten lo genera
          for d in GLOBAL/PT-BR_BRL GLOBAL/EN-US_BRL ADDITIONAL; do
            F=$(curl -sS --max-time 60 -u "$U:$P" "sftp://aftp.linksynergy.com/$d/" | awk '{print $NF}' | grep '^46796_' | grep -v delta | head -1)
            [ -n "$F" ] && break
          done
          [ -n "$F" ] || { echo "Nuuvem: Rakuten todavía no ha dejado el catálogo en el SFTP"; exit 0; }
          echo "Nuuvem: $d/$F"
          curl -sS --max-time 400 -u "$U:$P" -o "feeds/$F" "sftp://aftp.linksynergy.com/$d/$F"
          python3 scripts/nuuvem_feed.py "feeds/$F" feeds/nuuvem.json
          rm -f "feeds/$F"
      - name: Catálogo de K4G por CJ (con enlace de afiliado cuando CJ nos acepte)
        continue-on-error: true
        env:
          CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
        run: |
          mkdir -p feeds
          python3 scripts/cj_catalogo.py 5923171 feeds/k4g.json
          python3 scripts/cj_catalogo.py 5923171 feeds/k4g-latam.json USD
          python3 scripts/cj_catalogo.py 7145521 feeds/yuplay-cj.json || true   # Yuplay (unidos en CJ desde el 23 nov)
          python3 scripts/cj_catalogo.py 6086371 feeds/gamivo-cj.json && python3 scripts/gamivo_feed.py feeds/gamivo-cj.json feeds/gamivo.json || true   # Gamivo (unidos en CJ desde el 25 nov)
          python3 scripts/cj_catalogo.py 6086371 feeds/gamivo-cj-usd.json USD && python3 scripts/gamivo_feed.py feeds/gamivo-cj-usd.json feeds/gamivo-usd.json || true
      - run: |
          # quita espacios o saltos de línea que se cuelan al pegar claves
          export ITAD_KEY=$(printf '%s' "$ITAD_KEY" | tr -d '[:space:]') EBAY_CLIENT_ID=$(printf '%s' "$EBAY_CLIENT_ID" | tr -d '[:space:]') EBAY_CLIENT_SECRET=$(printf '%s' "$EBAY_CLIENT_SECRET" | tr -d '[:space:]')
          node scripts/actualizar.mjs
        env:
          ITAD_KEY: ${{ secrets.ITAD_KEY }}
          TRADEDOUBLER_TOKEN: ${{ secrets.TRADEDOUBLER_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          BUSCADOR_URL: ${{ vars.BUSCADOR_URL }}
      - name: Revisar que todas las tiendas dan precios
        run: node scripts/salud.mjs
      # Telegram ya no publica después de cada actualización: lo hace «Tanda de chollos en Telegram», un chollo a cada hora fija (5 al día)
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "pillao-bot"
          git config user.email "pillao-bot@users.noreply.github.com"
          git add -A precios.json precios-[0-9]*.json; git add precios.json $(ls precios-2.json precios-latam.json 2>/dev/null) minimos.json data/historial data/salud.json $(ls data/telegram.json data/mercados.json data/yuplay.json data/imagenes.json data/mediamarkt.json data/xtralife.json data/pcbox.json data/xtralife-todo.json data/pcbox-todo.json data/latam-cache.json 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "Precios actualizados"
          # Si mientras tanto se ha subido otra versión de los precios, manda la de esta ejecución (es la más reciente)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
      # Latinoamérica va después de guardar los precios de España: si se alarga o falla, España ya está guardada
      - name: Catálogo de Latinoamérica (precios-latam.json, en dólares)
        if: always()
        continue-on-error: true
        timeout-minutes: 55
        run: node scripts/latam.mjs
        env:
          ITAD_KEY: ${{ secrets.ITAD_KEY }}
      - name: Guardar Latinoamérica
        if: always()
        continue-on-error: true
        run: |
          git add -A precios-latam*.json; git add $(ls precios-latam.json data/latam-cache.json 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "Precios de Latinoamérica actualizados"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
      # Estados Unidos, después de Latinoamérica: si se alarga o falla, lo demás ya está guardado
      - name: Catálogo de Estados Unidos (precios-us.json, en dólares)
        if: always()
        continue-on-error: true
        timeout-minutes: 50
        run: node scripts/eeuu.mjs
        env:
          ITAD_KEY: ${{ secrets.ITAD_KEY }}
      - name: Guardar Estados Unidos
        if: always()
        continue-on-error: true
        run: |
          git add -A precios-us*.json; git add $(ls precios-us.json data/eeuu-cache.json 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "Precios de Estados Unidos actualizados"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
      # Alemania (dentro de Europa), al final: si se alarga o falla, lo demás ya está guardado
      - name: Catálogo de Alemania (precios-de.json, en euros, solo digital)
        if: always()
        continue-on-error: true
        timeout-minutes: 45
        run: node scripts/alemania.mjs
        env:
          ITAD_KEY: ${{ secrets.ITAD_KEY }}
      - name: Guardar Alemania
        if: always()
        continue-on-error: true
        run: |
          git add -A precios-de*.json; git add $(ls precios-de.json 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "Precios de Alemania actualizados"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
      - name: Avisar si alguna tienda ha dejado de dar precios
        if: env.FUENTES_CON_PROBLEMAS == '1'
        run: |
          echo "::error::Alguna tienda ha dejado de dar precios. Mira el resumen de la ejecución («Revisar que todas las tiendas dan precios»)."
          exit 1
