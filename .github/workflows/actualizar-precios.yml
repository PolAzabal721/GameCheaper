name: Actualizar precios

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar.mjs
        env:
          ITAD_KEY: ${{ secrets.ITAD_KEY }}
      - name: Guardar cambios
        run: |
          git config user.name "pillao-bot"
          git config user.email "pillao-bot@users.noreply.github.com"
          git add precios.json
          git diff --cached --quiet || git commit -m "Precios actualizados"
          git push
