name: Actualizar precios

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: |
          # quita espacios o saltos de línea que se cuelan al pegar claves
          export ITAD_KEY=$(printf '%s' "$ITAD_KEY" | tr -d '[:space:]') EBAY_CLIENT_ID=$(printf '%s' "$EBAY_CLIENT_ID" | tr -d '[:space:]') EBAY_CLIENT_SECRET=$(printf '%s' "$EBAY_CLIENT_SECRET" | tr -d '[:space:]')
          node scripts/actualizar.mjs
        env:
          ITAD_KEY: ${{ secrets.ITAD_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          BUSCADOR_URL: ${{ vars.BUSCADOR_URL }}
      - name: Revisar que todas las tiendas dan precios
        run: node scripts/salud.mjs
      - name: Guardar cambios
        run: |
          git config user.name "pillao-bot"
          git config user.email "pillao-bot@users.noreply.github.com"
          git add precios.json minimos.json data/historial data/salud.json
          git diff --cached --quiet && exit 0
          git commit -m "Precios actualizados"
          # Si mientras tanto se ha subido otra versión de los precios, manda la de esta ejecución (es la más reciente)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
      - name: Avisar si alguna tienda ha dejado de dar precios
        if: env.FUENTES_CON_PROBLEMAS == '1'
        run: |
          echo "::error::Alguna tienda ha dejado de dar precios. Mira el resumen de la ejecución («Revisar que todas las tiendas dan precios»)."
          exit 1
