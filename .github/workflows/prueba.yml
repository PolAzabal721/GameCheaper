name: prueba
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - env:
          F: ${{ secrets.ALIEXPRESS_FEED }}
        run: |
          [ -z "$F" ] && { echo "SIN SECRETO"; exit 1; }
          cat > a.py <<'P'
          import sys,csv,re,collections
          csv.field_size_limit(10**9)
          r=csv.reader(sys.stdin, delimiter=';'); cab=next(r)
          cats=collections.Counter(); ej=collections.defaultdict(list)
          CAT=re.compile(r'game|giftcard|gift card|software|video|console|digital|key|card',re.I)
          for row in r:
            d=dict(zip(cab,row)); c=d.get('category','')
            if CAT.search(c):
              cats[c]+=1
              if len(ej[c])<12: ej[c].append((d.get('name','')[:110], d.get('price'), d.get('currencyId')))
          print('CATSJ',cats.most_common(40))
          for c,_ in cats.most_common(15):
            for e in ej[c]: print('E',c,'|',e)
          P
          time (curl -sL "$F" | python3 a.py) 2>&1 | tail -120
