name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probar
        run: |
          cat > p.mjs <<'JS'
          const H={"User-Agent":"Mozilla/5.0 (compatible; Pillao/2.0; +https://pillaojuegos.com)"};
          const sleep=(ms)=>new Promise(s=>setTimeout(s,ms));
          { const h=await (await fetch("https://k4g.com/product/7-days-to-die-steam-europe-instant-cd-key-standard-edition-cd-key-2157A0E6",{headers:H})).text(); console.log("K4G", h.length, (h.match(/<title>([^<]*)/)||[])[1], (h.match(/"name"\s*:\s*"([^"]{5,120})"/g)||[]).slice(0,5).join(" ## ")); }
          const Y="https://www.yuplay.com"; const jar=new Map();
          const ir=async(u,j)=>{const r=await fetch(Y+u,{headers:{...H,Cookie:[...jar].map(([k,v])=>k+"="+v).join("; "),Referer:Y+"/",...(j?{Accept:"application/json"}:{})},redirect:"manual"});(r.headers.getSetCookie?.()||[]).map(c=>c.split(";")[0]).forEach(c=>{const i=c.indexOf("=");jar.set(c.slice(0,i),c.slice(i+1))});return r;};
          await ir("/"); await ir("/api/currency/euro/");
          for (const q of ["steam","card","membership","credits","online","pass","eshop","riot","valorant","minecoins","tinder gold"]) { const r=await ir(`/api/products/?search=${encodeURIComponent(q)}`,true); const d=await r.json(); console.log("Q",q,d.extensions?.count); for (const p of (d.products||[]).filter(p=>/card|gift|wallet|points|coins|credit|month|membership|subscription|online|pass|gold|eur|usd/i.test(p.name))) console.log("  Y", p.name,"|",p.price,"|",p.link); await sleep(400); }
          for (const l of ["/product/playstation-network-card-10-psn-spain/","/product/roblox-gift-card-1000-robux/","/product/ea-sports-fc-27-2800-fc-points-xbox-one-xbox-series-xs/","/product/blizzard-gift-card-20/","/product/avowed-xbox-series-xs-pc/","/product/ea-play-12-months-subscription/","/product/euro-truck-simulator-2/"]) { const r=await ir(l); const h=await r.text(); console.log("F", l, r.status, (h.match(/data-tooltip_content="[^"]{0,120}/g)||[]).join(" || "), "| PLAT:", (h.match(/Available Platform:<\/span><div><a [^>]*title="([^"]+)"/)||[])[1], "| SPAIN:", /Can be activated in[^"]*Spain/.test(h)); await sleep(500); }
          JS
          node p.mjs
