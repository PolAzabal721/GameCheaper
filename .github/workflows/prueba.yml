name: Prueba
on:
  workflow_dispatch:
jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fichas de las tiendas candidatas
        run: |
          cat > p.mjs <<'JS'
          const UA={"User-Agent":"Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)","Accept-Language":"es-ES,es;q=0.9"};
          const esperar=(ms)=>new Promise(r=>setTimeout(r,ms));
          const locs=(t)=>[...t.matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/g)].map(m=>m[1]);
          async function txt(u){ const r=await fetch(u,{headers:UA,redirect:"follow"}); return [r.status, await r.text()]; }
          function precio(t){
            const ld=[...t.matchAll(/<script[^>]*ld\+json[^>]*>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
            const prod=ld.find(b=>/"Product"/.test(b))||"";
            const g=(re)=>(prod.match(re)||t.match(re)||[])[1];
            return {ld:ld.length, nombre:g(/"name"\s*:\s*"([^"]{3,120})"/), precio:g(/"price"\s*:\s*"?([0-9.,]+)/), moneda:g(/"priceCurrency"\s*:\s*"([A-Z]{3})"/), stock:g(/"availability"\s*:\s*"[^"]*\/(\w+)"/)};
          }
          const tiendas=[
            ["driffle","https://driffle.com/sitemaps/products-sitemap-1.xml", /\/[a-z0-9-]+-p\d+|driffle\.com\/(es\/)?[a-z0-9-]+-key/],
            ["difmark","https://difmark.com/sitemaps/sitemap-es-1.xml", /buy-.*-key-\d+/],
            ["keys4us","https://keys4us.com/sitemap_index.xml", /product/],
            ["bitcodes","https://bitcodes.co/wp-sitemap.xml", /product/],
            ["gameseal","https://gameseal.com/es/sitemaps/sitemap.xml", /./],
            ["k4g","https://cdn.k4g.com/files/sitemap/sitemap.xml", /./],
            ["gamingdragons","https://www.gamingdragons.com/sitemap.xml", /./],
          ];
          for(const [n,mapa,filtro] of tiendas){
            try{
              let [st,t]=await txt(mapa); let us=locs(t);
              console.log(`=== ${n} ${mapa} -> ${st} ${us.length} entradas`);
              // si es índice de mapas, entrar en el primero que parezca de productos
              if(us.length && /\.xml(\.gz)?$/.test(us[0])){
                const sub=us.find(u=>/product/i.test(u)&&/es|spa/i.test(u))||us.find(u=>/product/i.test(u))||us[0];
                console.log(`   submapas ej: ${us.slice(0,6).join(" | ")}`);
                await esperar(1200); [st,t]=await txt(sub); us=locs(t); console.log(`   entro en ${sub} -> ${st} ${us.length} urls`);
                if(us.length && /\.xml(\.gz)?$/.test(us[0])){ const sub2=us[0]; await esperar(1200); [st,t]=await txt(sub2); us=locs(t); console.log(`   y en ${sub2} -> ${us.length} urls`); }
              }
              const prods=us.filter(u=>filtro.test(u)&&!/\.xml/.test(u)&&!/account|cuenta/i.test(u));
              console.log(`   ej urls: ${prods.slice(0,3).join(" | ")}`);
              for(const u of prods.slice(5,7)){
                await esperar(1500);
                const [s2,h]=await txt(u);
                console.log(`   FICHA ${s2} ${u} ${JSON.stringify(precio(h))}`);
              }
            }catch(e){ console.log(`=== ${n} ERROR ${e.message}`); }
            await esperar(1000);
          }
          JS
          node p.mjs
