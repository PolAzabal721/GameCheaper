name: Prueba
on:
  workflow_dispatch:
jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: De donde sacar el precio en Kinguin
        run: |
          node -e '
          const UA={"User-Agent":"Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)","Accept-Language":"es-ES,es;q=0.9"};
          (async()=>{
            const u="https://www.kinguin.net/es/category/1000/command-and-conquer-the-ultimate-collection-pc-ea-app-cd-key";
            const t=await (await fetch(u,{headers:UA})).text();
            console.log("bytes", t.length);
            for(const re of [/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/g]){
              for(const m of t.matchAll(re)) console.log("LD >>> "+m[1].slice(0,700).replace(/\s+/g," "));
            }
            for(const clave of ["\"price\"","\"lowestPrice\"","\"priceCurrency\"","\"offers\"","\"activePreorder\"","\"platform\"","\"regionalLimitations\":\"","\"name\":\""]){
              const i=t.indexOf(clave);
              console.log("CLAVE "+clave+" -> "+(i<0?"no":t.slice(i-60,i+220).replace(/\s+/g," ")));
            }
          })()'
