name: Prueba
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: |
          cat > p.mjs <<'X'
          const H={"User-Agent":"Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)","Accept-Language":"es-ES,es;q=0.9"};
          for (const u of ["https://www.instant-gaming.com/es/tarjetas-regalo/","https://www.instant-gaming.com/es/tarjetas-regalo/vod/marcas/apple/","https://www.instant-gaming.com/es/tarjetas-regalo/music/marcas/apple/","https://www.instant-gaming.com/es/pc/tarjetas-regalo/"]) {
            const r=await fetch(u,{headers:H}); const h=await r.text();
            const prods=[...new Set([...h.matchAll(/\/es\/(\d+)-comprar-([a-z0-9-]+)\//g)].map(m=>m[2]))];
            const cats=[...new Set([...h.matchAll(/\/es\/tarjetas-regalo\/([a-z0-9/-]*)/g)].map(m=>m[1]))];
            console.log("URL",u.replace("https://www.instant-gaming.com/es/",""),r.status,h.length,"| productos",prods.length,"| categorias",cats.slice(0,25).join(" "));
            console.log("   ",prods.slice(0,25).join("\n    "));
            await new Promise(x=>setTimeout(x,1500));
          }
          X
          node p.mjs
