name: Prueba
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mixto datos
        run: |
          curl -s https://pillaojuegos.com/precios.json -o p.json
          echo "== tamano"; ls -la p.json
          echo "== http:// en los datos"; grep -o 'http://[^"]*' p.json | sort -u | head -20; echo "(fin)"
          echo "== buscador"; grep -o '"buscador":"[^"]*"' p.json | head -2
          echo "== prefijos"; grep -o '"prefijos":\[[^]]*\]' p.json | head -c 1200
