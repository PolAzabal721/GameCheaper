name: Prueba
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "== https"; curl -sI https://pillaojuegos.com/ | grep -i "^HTTP\|strict-transport"
          echo "== http"; curl -sI http://pillaojuegos.com/ | grep -i "^HTTP\|^location"
