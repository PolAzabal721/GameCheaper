name: Prueba
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Direcciones separadas por espacios"
        required: true
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Descargar imágenes para una vista previa
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p vista
          i=0; for u in $URLS; do i=$((i+1)); curl -s -L -A "Mozilla/5.0" -o "vista/$(echo -n "$u" | md5sum | cut -c1-16).jpg" "$u"; done
          ls vista | wc -l
          git config user.name "pillao-bot"; git config user.email "pillao-bot@users.noreply.github.com"
          git checkout -b vista-tmp && git add vista && git commit -qm "Imágenes de vista previa" && git push -qf origin vista-tmp
