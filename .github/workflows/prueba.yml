name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Yuplay moneda
        run: |
          UA="Mozilla/5.0 (compatible; Pillao/2.0; +https://pillaojuegos.com)"
          curl -s -A "$UA" -c cj.txt -b cj.txt -o /dev/null -w 'portada %{http_code}\n' https://www.yuplay.com/
          curl -s -A "$UA" -c cj.txt -b cj.txt -L -o /dev/null -w 'euro %{http_code} %{url_effective}\n' -H "Referer: https://www.yuplay.com/" https://www.yuplay.com/api/currency/euro/
          cat cj.txt | grep -v '^#' | awk '{print $6"="substr($7,1,20)}'
          curl -s -A "$UA" -b cj.txt "https://www.yuplay.com/api/products/?page=1" > l.json
          python3 -c "
          import json;d=json.load(open('l.json'));print('EXT',d['extensions']);print('N por página',len(d['products']))
          for p in d['products'][:3]: print({k:p.get(k) for k in ['name','link','price','base_price','currency_code','discount','platform','drm','region','regions']}); 
          print('CLAVES', list(d['products'][0].keys()))"
          python3 -c "
          import json;d=json.load(open('l.json'))
          for p in d['products'][:4]: print(p['name'],'|',json.dumps(p.get('activations'))[:900]); print('---', p.get('is_preorder'), p.get('note'), p.get('images'))"
          curl -s -A "$UA" -b cj.txt "https://www.yuplay.com/api/products/?page=300" | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          import collections;c=collections.Counter()
          for p in d['products']:
            a=p.get('activations') or {}
            print(p['name'][:40],'|',json.dumps(a)[:300])"
