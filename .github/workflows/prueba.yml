name: prueba
on: workflow_dispatch
jobs:
  p:
    runs-on: macos-latest
    steps:
      - run: |
          npm i playwright@1.49.1 2>&1 | tail -1; npx playwright install webkit 2>&1 | tail -2
          cat > t.mjs <<'J'
          import { webkit, devices } from 'playwright';
          const u='https://pdt.tradedoubler.com/click?a(3508009)p(270504)product(24915-1679046)ttid(3)url(https%3A%2F%2Fwww.mediamarkt.es%2Fes%2Fproduct%2F_ps5-football-manager-27-1679046.html)';
          const br=await webkit.launch(); const pg=await (await br.newContext(devices['iPhone 15'])).newPage();
          pg.on('requestfailed', r=>console.log('FALLO', r.url().slice(0,200), r.failure()?.errorText));
          pg.on('response', r=>{ if (r.status()>=300) console.log('RESP', r.status(), r.url().slice(0,120), (r.headers().location||'').slice(0,250)); });
          try { await pg.goto(u,{timeout:30000}); } catch(e){ console.log('GOTO', e.message.split('\n')[0]); }
          await pg.waitForTimeout(12000);
          console.log('FINAL', pg.url().slice(0,250)); await br.close();
          J
          node t.mjs
