name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Yuplay
        run: |
          UA="Mozilla/5.0 (compatible; Pillao/2.0; +https://pillaojuegos.com)"
          for c in "" "currency=EUR" "currency=eur; country=ES"; do
            curl -s -A "$UA" -b "$c" -o prod.html "https://www.yuplay.com/product/cities-in-motion-2/?currency=EUR"
            echo "== cookie [$c] $(grep -o 'data-currency="[A-Z]*" data-sku="[^"]*" data-price="[^"]*"' prod.html | head -1) $(grep -o 'Can be activated in:' prod.html | head -1) spain=$(grep -c 'Spain' prod.html)"
          done
          curl -s -A "$UA" -D - -o /dev/null "https://www.yuplay.com/api/currency/" | head -20; curl -s -A "$UA" "https://www.yuplay.com/api/currency/" | head -c 600; echo
          curl -s -A "$UA" "https://www.yuplay.com/api/products/?search=cities" | head -c 800; echo
          curl -s -A "$UA" -o prod.html "https://www.yuplay.com/product/cities-in-motion-2/"
          python3 -c "
          import re;h=open('prod.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'title=\"([^\"]*)\">Can be activated in:',h);print('ACT', (m.group(1)[:300] if m else None), 'Spain' in (m.group(1) if m else ''))
          m=re.search(r'Cannot be activated in:',h);print('NOACT', bool(m))
          i=h.find('product-platform');print(re.sub(r'\s+',' ',h[i-100:i+300]))"
