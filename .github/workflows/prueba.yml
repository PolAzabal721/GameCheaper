name: Prueba
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: HTTP a HTTPS
        run: |
          echo "== HTTP"; curl -sI http://pillaojuegos.com/ | head -4
          echo "== HTTP www"; curl -sI http://www.pillaojuegos.com/ | head -4
          echo "== HTTPS"; curl -sI https://pillaojuegos.com/ | head -3
