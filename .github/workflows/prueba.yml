name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Yuplay
        run: |
          UA="Mozilla/5.0 (compatible; Pillao/2.0; +https://pillaojuegos.com)"
          curl -s -A "$UA" -c cj.txt "https://www.yuplay.com/api/products/?page=1" > l1.json
          python3 -c "
          import json;d=json.load(open('l1.json'));print('EXT',d.get('extensions'));p=d['products'][0];print(json.dumps(p)[:2500])"
          X=$(grep XSRF cj.txt | awk '{print $7}')
          for b in '{"currency":"EUR"}' '{"code":"EUR"}' 'currency=EUR'; do
            curl -s -A "$UA" -b cj.txt -c cj.txt -X POST -H "X-XSRF-TOKEN: $X" -H "X-CSRFToken: $X" -H "Referer: https://www.yuplay.com/" -H "Content-Type: application/json" -d "$b" -w " HTTP %{http_code}\n" "https://www.yuplay.com/api/currency/" | tail -c 300; echo
            curl -s -A "$UA" -b cj.txt "https://www.yuplay.com/api/products/?page=1" | python3 -c "import json,sys;d=json.load(sys.stdin);p=d['products'][0];print('PRECIO',{k:v for k,v in p.items() if 'price' in k.lower() or 'curr' in k.lower()})"
          done
