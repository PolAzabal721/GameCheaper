name: Prueba
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Buscar en Instant Gaming
        run: |
          cat > p.mjs <<'X'
          const H={"User-Agent":"Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://github.com/PolAzabal721/GameCheaper)","Accept-Language":"es-ES,es;q=0.9"};
          function bloque(t,d){let i=t.indexOf("{",d),p=0,e=false;for(let k=i;k<t.length;k++){const c=t[k];if(e){if(c==="\\")k++;else if(c==='"')e=false;continue}if(c==='"')e=true;else if(c==="{")p++;else if(c==="}"&&--p===0)return t.slice(i,k+1)}return null}
          for (const q of ["valorant eur","valorant europa","league of legends eur","riot points eur","ubisoft connect","tarjeta ubisoft","creditos r6","amazon gift card","eneba"]) {
            const h=await (await fetch("https://www.instant-gaming.com/es/busquedas/?query="+encodeURIComponent(q),{headers:H})).text();
            const i=h.indexOf("window.searchResults = "); const hits=i<0?[]:(JSON.parse(bloque(h,i)).hits||[]);
            console.log("Q",q,hits.length);
            for(const x of hits.slice(0,12)) console.log("   ",x.name,"|",x.price_eur,"|",x.region||x.region_fulltext,"| prepaid",x.is_prepaid,"sub",x.is_subscription,"| blk",JSON.stringify(x.country_blacklist||[]).slice(0,60),"| wl",JSON.stringify(x.country_whitelist||[]).slice(0,60));
            await new Promise(r=>setTimeout(r,1500));
          }
          X
          node p.mjs
