name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Yuplay
        run: |
          UA="Mozilla/5.0 (compatible; Pillao/2.0; +https://pillaojuegos.com)"
          for s in crimson-desert-enhanced-charting-the-unknown devils-hunt cities-in-motion-2; do
            curl -s -A "$UA" -o prod.html "https://www.yuplay.com/product/$s/"
            echo "== $s"; python3 - <<'PY'
          import re
          h=open('prod.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>',h,re.S):
              if '"Product"' in m.group(1): print('LD', m.group(1)[:1200])
          for k in ['product:price','itemprop="price"','data-price','"price"','Region','region','Activation','DRM','Steam']:
              i=h.find(k); print(k, '->', re.sub(r'\s+',' ',h[max(0,i-150):i+250]) if i>=0 else None)
          PY
          done
