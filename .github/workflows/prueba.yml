name: Prueba
on:
  workflow_dispatch:
jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Euros en Driffle, Difmark y K4G
        run: |
          cat > p.mjs <<'JS'
          const UA={"User-Agent":"Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)","Accept-Language":"es-ES,es;q=0.9"};
          const esperar=(ms)=>new Promise(r=>setTimeout(r,ms));
          const ver=(t)=>{ const m=t.match(/"price"\s*:\s*"?([0-9.,]+)"?\s*,\s*"priceCurrency"\s*:\s*"([A-Z]{3})"/)||t.match(/"priceCurrency"\s*:\s*"([A-Z]{3})"\s*,\s*"price"\s*:\s*"?([0-9.,]+)/); return m?m.slice(1,3).join(" "):"-"; };
          const pruebas=[
            ["driffle base","https://driffle.com/007-first-light-deluxe-edition-europe-pc-steam-digital-key-p9995900",{}],
            ["driffle ?currency=EUR","https://driffle.com/007-first-light-deluxe-edition-europe-pc-steam-digital-key-p9995900?currency=EUR",{}],
            ["driffle cookie","https://driffle.com/007-first-light-deluxe-edition-europe-pc-steam-digital-key-p9995900",{Cookie:"currency=EUR; country=ES"}],
            ["driffle /es/","https://driffle.com/es/007-first-light-deluxe-edition-europe-pc-steam-digital-key-p9995900",{}],
            ["difmark es","https://difmark.com/es/buy-cheap-csgolive-key-100-usd-12533",{}],
            ["difmark ?currency=EUR","https://difmark.com/es/buy-cheap-csgolive-key-100-usd-12533?currency=EUR",{}],
            ["difmark cookie","https://difmark.com/es/buy-cheap-csgolive-key-100-usd-12533",{Cookie:"currency=EUR"}],
            ["difmark ?cur=eur","https://difmark.com/es/buy-cheap-csgolive-key-100-usd-12533?cur=EUR",{}],
          ];
          for(const [n,u,h] of pruebas){
            try{ const r=await fetch(u,{headers:{...UA,...h}}); const t=await r.text(); console.log(`${n} -> ${r.status} ${ver(t)}`); }
            catch(e){ console.log(`${n} ERROR ${e.message}`); }
            await esperar(1500);
          }
          // K4G: donde está el precio
          const r=await fetch("https://k4g.com/product/age-of-empires-ii-steam-global-cd-key-definitive-edition-cd-key-3161EFB6",{headers:UA}); const t=await r.text();
          for(const k of ['"price"','price','€','EUR','"offers"','data-price','__NEXT_DATA__','window.__']){ const i=t.indexOf(k); console.log("K4G "+k+" -> "+(i<0?"no":t.slice(Math.max(0,i-80),i+160).replace(/\s+/g," "))); }
          JS
          node p.mjs
