name: Prueba
on:
  workflow_dispatch:
jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dónde está GTA VI en los mapas de las tiendas
        run: |
          cat > p.mjs <<'JS'
          import zlib from "node:zlib";
          const UA={"User-Agent":"Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)","Accept-Language":"es-ES,es;q=0.9"};
          const esperar=(ms)=>new Promise(r=>setTimeout(r,ms));
          const locs=(t)=>[...t.matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/g)].map(m=>m[1]);
          const txt=async(u)=>{ const r=await fetch(u,{headers:UA}); const b=Buffer.from(await r.arrayBuffer()); return /\.gz$/.test(u)? zlib.gunzipSync(b).toString(): b.toString(); };
          const GTA=/grand-theft-auto-vi(?!i)|gta-vi\b|gta-6|grand-theft-auto-6/i;
          // GAME
          try{ const s=await txt("https://www.game.es/sitemap_productos.xml"); const u=locs(s); console.log("GAME productos:",u.length); console.log("GAME GTA VI:", u.filter(x=>GTA.test(x)).join(" | ")||"nada"); }catch(e){console.log("GAME ERR",e.message)}
          // Microsoft (xbox.com)
          try{ let n=0, hits=[]; for(let i=1;i<=12;i++){ let s; try{ s=await txt(`https://www.xbox.com/sitemap/pdp-es-ES-sitemap-${i}.xml.gz`);}catch{break} const u=locs(s); if(!u.length) break; n+=u.length; hits.push(...u.filter(x=>GTA.test(x))); await esperar(500);} console.log("XBOX urls:",n,"GTA VI:",hits.join(" | ")||"nada"); }catch(e){console.log("XBOX ERR",e.message)}
          // PlayStation
          try{ const s=await txt("https://www.playstation.com/es-es/sitemap.xml"); const sub=locs(s); let hits=[]; for(const m of sub.slice(0,30)){ try{ const u=locs(await txt(m)); hits.push(...u.filter(x=>GTA.test(x))); }catch{} await esperar(300);} console.log("PS GTA VI:",[...new Set(hits)].join(" | ")||"nada"); }catch(e){console.log("PS ERR",e.message)}
          // Instant Gaming
          try{ let hits=[]; for(let i=1;i<=8;i++){ const r=await fetch(`https://www.instant-gaming.com/sitemap_ig_products_es${i>1?"_"+i:""}.xml`,{headers:UA}); if(r.status===404)break; hits.push(...locs(await r.text()).filter(x=>GTA.test(x))); await esperar(400);} console.log("IG GTA VI:",hits.join(" | ")||"nada"); }catch(e){console.log("IG ERR",e.message)}
          JS
          node p.mjs
