name: Prueba
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS
        run: |
          for t in A AAAA CNAME CAA NS; do echo "== $t pillaojuegos.com"; dig +short $t pillaojuegos.com @8.8.8.8; echo "== $t www"; dig +short $t www.pillaojuegos.com @8.8.8.8; done
          echo "== HTTP"; curl -sI http://pillaojuegos.com | head -5
          echo "== HTTPS"; curl -sI https://pillaojuegos.com 2>&1 | head -5
          echo "== WWW"; curl -sI http://www.pillaojuegos.com | head -5
          echo "== titulo"; curl -sL http://pillaojuegos.com | grep -o "<title>[^<]*" | head -2
