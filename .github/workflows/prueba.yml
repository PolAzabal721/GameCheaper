name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Gamivo
        run: |
          UA="Mozilla/5.0 (compatible; Pillao/2.0; +https://pillaojuegos.com)"
          for u in https://www.gamivo.com/robots.txt https://www.gamivo.com/ https://www.gamivo.com/sitemap.xml https://www.gamivo.com/product/elden-ring-pc-steam-global-en-key; do
            echo "== $u"; curl -s -A "$UA" -o r.txt -w 'HTTP %{http_code} %{size_download}\n' "$u"; head -c 1200 r.txt | tr '\n' ' ' | cut -c1-1200; echo
          done
