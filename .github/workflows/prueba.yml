name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar el token de Tradedoubler
        env:
          T: ${{ secrets.TRADEDOUBLER_TOKEN }}
        run: |
          [ -z "$T" ] && { echo "NO HAY SECRETO TRADEDOUBLER_TOKEN"; exit 0; }
          echo "largo del token: ${#T}"
          code=$(curl -s -o feeds.json -w '%{http_code}' "https://api.tradedoubler.com/1.0/productFeeds?token=$T")
          echo "HTTP $code"; head -c 1500 feeds.json; echo
