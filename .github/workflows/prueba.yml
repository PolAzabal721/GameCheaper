name: Prueba
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Redireccion y HSTS
        run: |
          echo "== http -> ?"; curl -sI http://pillaojuegos.com/ | grep -i "^HTTP\|^location"
          echo "== https cabeceras completas"; curl -sI https://pillaojuegos.com/ | grep -i "strict-transport\|^HTTP"
          echo "== http www -> ?"; curl -sI http://www.pillaojuegos.com/ | grep -i "^HTTP\|^location"
