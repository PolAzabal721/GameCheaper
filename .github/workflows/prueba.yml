name: Prueba

on:
  workflow_dispatch:

jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Comprobar la foto que da la ficha oficial
        run: |
          node -e '
          const ids=["3843530","4530370","3669620","2272360","3115160"];
          (async()=>{
            const d=await (await fetch("https://store.steampowered.com/api/appdetails?appids="+ids.join(",")+"&cc=es&filters=price_overview,basic")).json();
            for(const id of ids){
              const h=d[id]?.data?.header_image||"(nada)";
              const m=String(h).match(/\/apps\/(\d+)\/([0-9a-f]{8,64})\/header\.jpg/);
              const u=m?`https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${m[1]}/${m[2]}/header.jpg`:h.split("?")[0];
              const r=await fetch(u,{method:"HEAD"});
              console.log(id, m?"sc:"+m[1]+"/"+m[2]:"(sin carpeta)", r.status);
            }
          })()'
