name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Yuplay
        run: |
          cat > p.mjs <<'JS'
          const Y="https://www.yuplay.com"; const jar=new Map();
          const H={"User-Agent":"Mozilla/5.0 (compatible; Pillao/2.0; +https://pillaojuegos.com)"};
          const ir=async(u,j)=>{const r=await fetch(Y+u,{headers:{...H,Cookie:[...jar].map(([k,v])=>k+"="+v).join("; "),Referer:Y+"/",...(j?{Accept:"application/json"}:{})},redirect:"manual"});(r.headers.getSetCookie?.()||[]).map(c=>c.split(";")[0]).forEach(c=>{const i=c.indexOf("=");jar.set(c.slice(0,i),c.slice(i+1))});return r;};
          await ir("/"); await ir("/api/currency/euro/");
          let r=await ir("/api/products/?page=1",true); let d=await r.json();
          console.log("PAG", JSON.stringify(d.extensions?.pagination)); console.log("KEYS", Object.keys(d)); console.log("P0", JSON.stringify(d.products[0]).slice(0,1500));
          r=await fetch(Y+"/robots.txt",{headers:H}); console.log("ROBOTS", (await r.text()).replace(/\n/g," ¦ ").slice(0,1500));
          r=await ir("/catalog/"); let h=await r.text(); console.log("CATST", r.status);
          const ps=new Set(); for (const m of h.matchAll(/(?:name|data-name|data-filter|data-param)="([a-z_]+)"/g)) ps.add(m[1]); console.log("PARAMS", [...ps].join(","));
          for (const m of h.matchAll(/href="(\/[a-z-]+\/[^"]*\?[^"]+)"/g)) console.log("HREF", m[1]);
          console.log("SORT", (h.match(/sort[^<]{0,300}/gi)||[]).slice(0,8).join(" ## "));
          for (const q of ["/api/products/?q=euro%20truck","/api/products/?search=euro%20truck","/api/products/?sort=-price","/api/products/?ordering=price","/api/products/?sort=price_asc","/api/products/?page=101","/api/products/?price_from=0&price_to=1","/api/products/?min_price=0&max_price=1","/search/?q=euro+truck"]) { r=await ir(q,true); const t=await r.text(); let x=""; try{const j=JSON.parse(t); x=JSON.stringify(j.extensions)+" "+(j.products||[]).slice(0,3).map(p=>p.name+" "+p.price).join(" | ");}catch{x=t.slice(0,200).replace(/\s+/g," ")} console.log("Q",q,r.status,x.slice(0,400)); }
          JS
          node p.mjs
