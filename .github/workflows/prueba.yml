name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probar
        run: |
          cat > p.mjs <<'JS'
          const H={"User-Agent":"Mozilla/5.0 (compatible; Pillao/2.0; +https://pillaojuegos.com)"};
          const Y="https://www.yuplay.com"; const jar=new Map();
          const ir=async(u,j)=>{const r=await fetch(Y+u,{headers:{...H,Cookie:[...jar].map(([k,v])=>k+"="+v).join("; "),Referer:Y+"/",...(j?{Accept:"application/json"}:{})},redirect:"manual"});(r.headers.getSetCookie?.()||[]).map(c=>c.split(";")[0]).forEach(c=>{const i=c.indexOf("=");jar.set(c.slice(0,i),c.slice(i+1))});return r;};
          await ir("/"); await ir("/api/currency/euro/");
          let r=await ir("/product/tinder-gold-1-month-subscription/"); let h=await r.text();
          console.log("ST", r.status, (h.match(/data-tooltip_content="[^"]{0,100}/g)||[]).join(" | "), "PLAT", (h.match(/Available Platform:<\/span><div><a [^>]*title="([^"]+)"/)||[])[1]);
          for (const m of h.matchAll(/href="(\/(?:products|catalog|collections?|category|categories|gift|giftcards?)[^"]*)"/g)) console.log("HREF", m[1]);
          console.log("BREAD", (h.match(/breadcrumb[\s\S]{0,800}/i)||[""])[0].replace(/\s+/g," ").slice(0,800));
          r=await ir("/api/collections/",true); console.log("COL", r.status, (await r.text()).slice(0,1500));
          for (const q of ["/api/products/?category=gift-cards","/api/products/?type=giftcard","/api/products/?platforms=tinder","/api/products/?recommendation=gift-cards"]) { r=await ir(q,true); const t=await r.text(); let x; try{const d=JSON.parse(t); x=d.extensions?.count+" "+(d.products||[]).slice(0,4).map(p=>p.name).join(" | ");}catch{x=t.slice(0,100)} console.log("Q",q,r.status,x); }
          JS
          node p.mjs
