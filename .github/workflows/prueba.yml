name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: MediaMarkt
        env:
          TD: ${{ secrets.TRADEDOUBLER_TOKEN }}
        run: |
          T=$(printf '%s' "$TD" | tr -d '[:space:]')
          echo "token: ${#T} caracteres"
          curl -s "https://api.tradedoubler.com/1.0/productsUnlimited/lastUpdated.json;fid=24915?token=$T"; echo
          curl -s -L -o feed.zip -w 'descarga HTTP %{http_code} %{size_download}\n' "https://api.tradedoubler.com/1.0/productsUnlimited.json;compress=zip;fid=24915?token=$T"
          file feed.zip; mkdir -p f && (unzip -o -q feed.zip -d f || true); ls -la f | head
          cat > p.mjs <<'JS'
          import fs from "fs";
          const fl = fs.readdirSync("f").map(x=>"f/"+x)[0];
          const d = JSON.parse(fs.readFileSync(fl,"utf8"));
          const F=(p,n)=>(p.fields||[]).find(x=>x.name===n)?.value||"";
          const c2={},c3={}; for(const p of d.products){ const a=F(p,"category_second_level"); c2[a]=(c2[a]||0)+1; if(/juego|videojuego|consol|tarjeta|gaming|playstation|xbox|nintendo/i.test(a)){ const b=a+" > "+F(p,"category_third_level"); c3[b]=(c3[b]||0)+1; } }
          console.log("C2",JSON.stringify(Object.entries(c2).sort((a,b)=>b[1]-a[1]).slice(0,80)));
          console.log("C3",JSON.stringify(Object.entries(c3).sort((a,b)=>b[1]-a[1])));
          const j=d.products.find(p=>F(p,"category_second_level")==="Juegos"); const o=j.offers[0]; console.log("OFERTA",JSON.stringify({...o,productUrl:o.productUrl.slice(0,60)}).slice(0,1500)); console.log("CAMPOS",JSON.stringify(j.fields.map(f=>f.name))); console.log("IMG",JSON.stringify(j.productImage||j.images||"").slice(0,200));
          const ej=d.products.filter(p=>F(p,"category_second_level")==="Juegos").slice(0,40).map(p=>p.name+" | "+F(p,"category_third_level")+" | "+p.offers[0].priceHistory?.[0]?.price?.value+" | "+p.offers[0].availability); console.log("NOMBRES\n"+ej.join("\n"));
          JS
          node p.mjs
