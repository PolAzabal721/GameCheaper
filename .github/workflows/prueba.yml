name: Prueba
on:
  workflow_dispatch:
jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kinguin, Eneba y gamespsn
        run: |
          node -e '
          const UA={"User-Agent":"Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://pillaojuegos.com)","Accept-Language":"es-ES,es;q=0.9"};
          const esperar=(ms)=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            // Kinguin: su mapa del sitio y una ficha (robots pide 2 s entre peticiones)
            for(const u of ["https://static.kinguin.net/media/sitemap/sitemap.xml","https://www.kinguin.net/category/5/hogwarts-legacy-steam-key"]){
              try{ const r=await fetch(u,{headers:UA}); const t=await r.text();
                console.log("KINGUIN "+u+" -> "+r.status+" bytes "+t.length+" ldjson "+((t.match(/ld\+json/g)||[]).length));
                console.log("   "+t.slice(0,300).replace(/\s+/g," "));
              }catch(e){console.log("KINGUIN "+u+" ERROR "+e.message)}
              await esperar(2500);
            }
            // Eneba: una ficha de producto
            for(const u of ["https://www.eneba.com/es/steam-hogwarts-legacy-steam-key-global","https://www.eneba.com/sitemap.xml"]){
              try{ const r=await fetch(u,{headers:UA}); const t=await r.text();
                console.log("ENEBA "+u+" -> "+r.status+" bytes "+t.length+" ldjson "+((t.match(/ld\+json/g)||[]).length)+" precio "+JSON.stringify((t.match(/"price"\s*:\s*"?[0-9.,]+/g)||[]).slice(0,2)));
              }catch(e){console.log("ENEBA "+u+" ERROR "+e.message)}
              await esperar(1500);
            }
            // gamespsn: su mapa del sitio y cuantos productos tiene
            for(const u of ["https://gamespsn.com/sitemap_index.xml","https://gamespsn.com/product-sitemap.xml"]){
              try{ const r=await fetch(u,{headers:UA}); const t=await r.text();
                console.log("GAMESPSN "+u+" -> "+r.status+" urls "+((t.match(/<loc>/g)||[]).length));
                console.log("   "+t.slice(0,400).replace(/\s+/g," "));
              }catch(e){console.log("GAMESPSN "+u+" ERROR "+e.message)}
              await esperar(1000);
            }
          })()'
