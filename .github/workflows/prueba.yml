name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Yuplay moneda
        run: |
          UA="Mozilla/5.0 (compatible; Pillao/2.0; +https://pillaojuegos.com)"
          curl -s -A "$UA" -c cj.txt -o home.html https://www.yuplay.com/
          echo "== menciones de currency en la portada"
          grep -o '[^ ]\{0,120\}currenc[^ ]\{0,160\}' home.html | grep -v cookiebot | head -25
          for js in $(grep -o 'src="[^"]*\.js[^"]*"' home.html | cut -d'"' -f2 | grep -v cookiebot | head -15); do
            case "$js" in http*) u="$js";; *) u="https://www.yuplay.com$js";; esac
            curl -s -A "$UA" "$u" | grep -o '.\{0,140\}currenc.\{0,200\}' | head -4 | sed "s|^|[$js] |"
          done
