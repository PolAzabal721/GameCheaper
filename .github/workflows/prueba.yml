name: Prueba
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Tarjetas
        run: |
          cat > p.mjs <<'X'
          import { gunzipSync } from "node:zlib";
          const H={"User-Agent":"Mozilla/5.0 (compatible; Pillao-comparador/2.0; +https://github.com/PolAzabal721/GameCheaper)","Accept-Language":"es-ES,es;q=0.9"};
          const t=async(u)=>{try{const r=await fetch(u,{headers:H});return [r.status,await r.text(),r.url]}catch(e){return [0,String(e),""]}};
          function bloque(t,d){let i=t.indexOf("{",d),p=0,e=false;for(let k=i;k<t.length;k++){const c=t[k];if(e){if(c==="\\")k++;else if(c==='"')e=false;continue}if(c==='"')e=true;else if(c==="{")p++;else if(c==="}"&&--p===0)return t.slice(i,k+1)}return null}
          for (const sm of ["sitemap_ig_products_es.xml","sitemap_ig_products_es_2.xml","sitemap_ig_products_es_3.xml","sitemap_ig_giftcards_es.xml"]) { const [s,b]=await t("https://www.instant-gaming.com/"+sm); const l=[...b.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]); console.log("SM",sm,s,l.length,l.slice(0,5).join(" ")); if(sm.includes("gift")) console.log("   GIFT",l.map(x=>x.replace("https://www.instant-gaming.com/es/","")).join(" ").slice(0,6000)); }
          for (const [n,extra] of [["sin",{}],["cookie",{Cookie:"currency=EUR; country=ES"}],["cookie2",{Cookie:"ig_currency=EUR"}]]) {
            const r=await fetch("https://www.instant-gaming.com/es/414-comprar-no-man-s-sky-pc-mac-steam/",{headers:{...H,...extra}}); const h=await r.text();
            const pr=h.match(/itemprop="price"[^>]*content="([^"]*)"/)||h.match(/content="([^"]*)"[^>]*itemprop="price"/); const cu=h.match(/itemprop="priceCurrency"[^>]*content="([^"]*)"/)||h.match(/content="([^"]*)"[^>]*itemprop="priceCurrency"/);
            console.log("PAG",n,r.status,pr&&pr[1],cu&&cu[1],"| price_eur:",(h.match(/"price_eur"\s*:\s*"?([\d.]+)/)||[])[1],"| data-price:",(h.match(/data-price[a-z-]*="([^"]+)"/)||[])[0],"| €:",(h.match(/[\d,.]+\s?€/)||[])[0], "| set-cookie:",(r.headers.get("set-cookie")||"").slice(0,200));
            const i2=h.indexOf("EUR"); console.log("   EURctx",i2,h.slice(Math.max(0,i2-200),i2+100).replace(/\s+/g," "));
            await new Promise(r=>setTimeout(r,1500));
          }
          X
          node p.mjs
