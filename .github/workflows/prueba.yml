name: prueba
on: workflow_dispatch
jobs:
  p:
    runs-on: macos-latest
    steps:
      - run: |
          npm i playwright@1.49.1 2>&1 | tail -1; npx playwright install webkit 2>&1 | tail -1
          cat > t.mjs <<'J'
          import { webkit, devices } from 'playwright';
          const CRIOS='Mozilla/5.0 (iPhone; CPU iPhone OS 18_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) CriOS/131.0.6778.73 Mobile/15E148 Safari/604.1';
          const br=await webkit.launch();
          const U='https://clk.tradedoubler.com/click?p=270504&a=3508009&epi=pillao&url='+encodeURIComponent('https://www.mediamarkt.es/es/product/_ps5-football-manager-27-1679046.html');
          for (const [n,ua] of [['safari',undefined],['chrome-ios',CRIOS]]) {
            const ctx=await br.newContext({...devices['iPhone 15'], ...(ua?{userAgent:ua}:{})}); const pg=await ctx.newPage();
            pg.on('request', r=>{ if (r.isNavigationRequest()) console.log(n,'REQ',r.method(),r.url().slice(0,220)); });
            await pg.goto(U).catch(e=>console.log(n,'GOTO',e.message.split('\n')[0])); await pg.waitForTimeout(12000);
            console.log(n,'FINAL',pg.url().slice(0,330)); await ctx.close();
          }
          await br.close();
          J
          node t.mjs
