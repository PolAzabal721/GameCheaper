name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Bundles de ITAD e imágenes por nombre
        env:
          K: ${{ secrets.ITAD_KEY }}
        run: |
          K=$(printf '%s' "$K" | tr -d '[:space:]')
          for o in 0 50 100; do curl -s "https://api.isthereanydeal.com/bundles/v1?key=$K&country=ES&limit=50&offset=$o" > b$o.json; done
          jq -s 'add | length' b0.json b50.json b100.json
          jq -c -s 'add | .[] | {t:.title, s:.page.name, u:.url, e:.expiry, m:.isMature, c:.counts, tiers:[.tiers[] | {p:.price, a:.addon, n:(.games|length), g:[.games[0:3][]|.title]}]}' b0.json b50.json b100.json | cut -c1-600
