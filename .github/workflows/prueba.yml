name: Prueba
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: HTTPS
        run: |
          echo "== HTTPS"; curl -sI https://pillaojuegos.com 2>&1 | head -3
          echo "== PRECIOS"; curl -s -o /dev/null -w "%{http_code} %{size_download}\n" https://pillaojuegos.com/precios.json 2>&1
          echo "== CERT"; echo | openssl s_client -connect pillaojuegos.com:443 -servername pillaojuegos.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1 | head -4
