name: Prueba
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Impact
        env:
          S: ${{ secrets.IMPACT_SID }}
          T: ${{ secrets.IMPACT_TOKEN }}
        run: |
          S=$(printf '%s' "$S" | tr -d '[:space:]'); T=$(printf '%s' "$T" | tr -d '[:space:]')
          echo "SID: ${#S} caracteres, empieza por ${S:0:2}"; echo "TOKEN: ${#T} caracteres"
          [ -z "$S" ] || [ -z "$T" ] && { echo "FALTAN SECRETOS"; exit 0; }
          for p in Campaigns Catalogs; do
            echo "== $p"; curl -s -u "$S:$T" -H "Accept: application/json" -w '\nHTTP %{http_code}\n' "https://api.impact.com/Mediapartners/$S/$p?PageSize=50" | python3 -c "
          import sys,json
          t=sys.stdin.read(); body,code=t.rsplit('HTTP',1); print('HTTP',code.strip())
          try:
            d=json.loads(body); k=[x for x in d if isinstance(d[x],list)]
            print('totales', d.get('@total'), 'listas', k)
            for x in (d[k[0]] if k else [])[:30]: print({a:x.get(a) for a in ['Id','Name','CampaignName','AdvertiserName','ContractStatus','NumberOfItems','Currency','Language','DateLastUpdated']})
          except Exception as e: print(body[:600])"
          done
