name: Prueba temporal FTP Loaded
on: workflow_dispatch
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Mirar qué archivos hay (sin descargar)
        env:
          U: ${{ secrets.LOADED_FTP_USER }}
          P: ${{ secrets.LOADED_FTP_PASS }}
        run: |
          echo "usuario: ${#U} car. | contraseña: ${#P} car."
          curl -sS --max-time 60 -u "$U:$P" "ftp://products.impact.com/" || true
          echo "--- /Loaded/"
          curl -sS --max-time 60 -u "$U:$P" "ftp://products.impact.com/Loaded/" || true
