name: Actualizar PlayStation

on:
  schedule:
    - cron: "47 2-23/6 * * *"   # cada 6 horas, a media hora de la actualización principal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playstation
  cancel-in-progress: false

jobs:
  playstation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node scripts/playstation.mjs
      - name: Guardar cambios
        run: |
          git config user.name "pillao-bot"
          git config user.email "pillao-bot@users.noreply.github.com"
          git add data/playstation.json
          git diff --cached --quiet && exit 0
          git commit -m "Precios de PlayStation actualizados"
          git pull --rebase origin main
          git push
