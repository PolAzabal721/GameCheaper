name: Prueba
on:
  push:
    branches: [vista-imgs]
permissions:
  contents: write
jobs:
  traer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p vista
          while read -r u; do [ -n "$u" ] && curl -s -L -A "Mozilla/5.0" -o "vista/$(echo -n "$u" | md5sum | cut -c1-16).jpg" "$u"; done < urls.txt
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add vista && git commit -qm "imgs" && git push -q origin HEAD:vista-imgs
