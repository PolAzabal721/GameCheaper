name: Mirar redes (temporal)
# Busca en CJ, Admitad, Tradedoubler, Rakuten e Impact las tiendas de LEGO, cartas y consolas reacondicionadas. No toca la web.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirar:
    runs-on: ubuntu-latest
    env:
      CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
      ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
      ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      TRADEDOUBLER_CLIENT_ID: ${{ secrets.TRADEDOUBLER_CLIENT_ID }}
      TRADEDOUBLER_SECRET: ${{ secrets.TRADEDOUBLER_SECRET }}
      TRADEDOUBLER_USER: ${{ secrets.TRADEDOUBLER_USER }}
      TRADEDOUBLER_PASS: ${{ secrets.TRADEDOUBLER_PASS }}
      RAKUTEN_CLIENT_ID: ${{ secrets.RAKUTEN_CLIENT_ID }}
      RAKUTEN_CLIENT_SECRET: ${{ secrets.RAKUTEN_CLIENT_SECRET }}
      IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
      IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
    steps:
      - run: |
          python3 - <<'PY'
          import os, re, json, base64, urllib.request, urllib.parse
          E = lambda k: (os.environ.get(k) or '').strip()
          KW = re.compile(r'lego|brick|toy|jugu|juguet|kid|eureka|pokemon|pok[eé]|card|carta|tcg|magic|trading|board ?game|juegos? de mesa|game|juego|refurb|reacond|rebuy|back ?market|cash ?conv|cex|second|segunda|console|consola|hobby|collect', re.I)
          def get(url, h=None, data=None, method=None):
            req = urllib.request.Request(url, data=data, headers=h or {}, method=method)
            try:
              with urllib.request.urlopen(req, timeout=90) as r: return r.status, r.read().decode('utf-8', 'replace')
            except urllib.error.HTTPError as e: return e.code, e.read().decode('utf-8', 'replace')
            except Exception as e: return 0, str(e)
          # ---------- CJ ----------
          print('\n########## CJ ##########')
          T = E('CJ_TOKEN')
          vistos = {}
          for rel in ('joined', 'notjoined'):
            for kw in ['lego','toys','juguetes','toy','pokemon','trading card','tcg','cards','board games','refurbished','reacondicionado','consoles','video games','collectibles','hobby']:
              for pg in (1, 2):
                q = urllib.parse.urlencode({'requestor-cid':'8127571','advertiser-ids':rel,'keywords':kw,'records-per-page':'100','page-number':str(pg)})
                s, x = get('https://advertiser-lookup.api.cj.com/v2/advertiser-lookup?' + q, {'Authorization':'Bearer ' + T})
                if s != 200: print('CJ', rel, kw, s, x[:200]); break
                ads = re.findall(r'<advertiser>(.*?)</advertiser>', x, re.S)
                for a in ads:
                  g = lambda t: (re.search('<%s>(.*?)</%s>' % (t, t), a, re.S) or [None, ''])[1].strip()
                  vistos[g('advertiser-id')] = (rel, g('advertiser-name'), g('program-url'), g('primary-category'), g('relationship-status'), g('account-status'))
                if len(ads) < 100: break
          for k, v in sorted(vistos.items(), key=lambda kv: kv[1][1].lower()):
            if v[5].lower() == 'active': print(f"{v[0]:9} | {k} | {v[1][:45]:45} | {v[2][:45]:45} | {v[3][:40]}")
          # ---------- Admitad ----------
          print('\n########## ADMITAD ##########')
          s, x = get('https://api.admitad.com/token/', {'Authorization':'Basic ' + base64.b64encode((E('ADMITAD_CLIENT_ID') + ':' + E('ADMITAD_CLIENT_SECRET')).encode()).decode(), 'Content-Type':'application/x-www-form-urlencoded'},
                     urllib.parse.urlencode({'grant_type':'client_credentials','client_id':E('ADMITAD_CLIENT_ID'),'scope':'advcampaigns websites advcampaigns_for_website'}).encode(), 'POST')
          try: tok = json.loads(x)['access_token']
          except Exception: print('Admitad token', s, x[:300]); tok = None
          if tok:
            H = {'Authorization':'Bearer ' + tok}
            s, x = get('https://api.admitad.com/websites/v2/?limit=50', H)
            webs = json.loads(x).get('results', []) if s == 200 else []
            print('Webs:', [(w.get('id'), w.get('name'), w.get('status')) for w in webs])
            wid = webs[0]['id'] if webs else None
            off = 0
            while wid and off < 6000:
              s, x = get(f'https://api.admitad.com/advcampaigns/website/{wid}/?limit=500&offset={off}', H)
              if s != 200: print('Admitad camp', s, x[:300]); break
              d = json.loads(x); res = d.get('results', [])
              for c in res:
                regs = ','.join(r.get('region','') for r in c.get('regions', []))[:40]
                cats = ','.join(k.get('name','') for k in c.get('categories', []))[:50]
                nom = c.get('name','')
                if (KW.search(nom) or KW.search(cats)) and (not regs or re.search(r'ES|00|EU|\bFR|DE|IT|PT', regs)):
                  print(f"{c.get('connection_status',''):10} | {c.get('id')} | {nom[:45]:45} | {regs:25} | {cats}")
              if len(res) < 500: break
              off += 500
          # ---------- Tradedoubler ----------
          print('\n########## TRADEDOUBLER ##########')
          s, x = get('https://connect.tradedoubler.com/uaa/oauth/token', {'Authorization':'Basic ' + base64.b64encode((E('TRADEDOUBLER_CLIENT_ID') + ':' + E('TRADEDOUBLER_SECRET')).encode()).decode(), 'Content-Type':'application/x-www-form-urlencoded'},
                     urllib.parse.urlencode({'grant_type':'password','username':E('TRADEDOUBLER_USER'),'password':E('TRADEDOUBLER_PASS')}).encode(), 'POST')
          try: tt = json.loads(x)['access_token']
          except Exception: print('TD token', s, x[:200]); tt = None
          if tt:
            H = {'Authorization':'Bearer ' + tt}
            s, x = get('https://connect.tradedoubler.com/publisher/sources', H); print('Fuentes', s, x[:400])
            for path in ('/publisher/programs?limit=100&offset={o}', '/publisher/programs/applied?limit=100&offset={o}'):
              o = 0; total = 0
              while o < 5000:
                s, x = get('https://connect.tradedoubler.com' + path.format(o=o), H)
                if s != 200: print(path, s, x[:300]); break
                d = json.loads(x); items = d.get('items', d if isinstance(d, list) else [])
                if o == 0: print(path, 'claves', list(d.keys()) if isinstance(d, dict) else 'lista', 'ejemplo', json.dumps(items[:1])[:600])
                for p in items:
                  nom = p.get('name') or p.get('programName') or ''
                  txt = json.dumps(p)
                  if KW.search(nom) or KW.search(p.get('category','') if isinstance(p.get('category'), str) else ''):
                    print(f"  {str(p.get('statusId') or p.get('status') or p.get('connectionStatus') or ''):12} | {p.get('id') or p.get('programId')} | {nom[:45]:45} | {str(p.get('countryCode') or p.get('market') or '')[:10]} | {str(p.get('categories') or p.get('category') or '')[:60]}")
                total += len(items)
                if len(items) < 100: break
                o += 100
              print(path, 'total', total)
          # ---------- Rakuten ----------
          print('\n########## RAKUTEN ##########')
          s, x = get('https://api.linksynergy.com/token', {'Authorization':'Bearer ' + base64.b64encode((E('RAKUTEN_CLIENT_ID') + ':' + E('RAKUTEN_CLIENT_SECRET')).encode()).decode(), 'Content-Type':'application/x-www-form-urlencoded'},
                     b'grant_type=client_credentials&scope=4779010', 'POST')
          try: rt = json.loads(x)['access_token']
          except Exception: print('Rakuten token', s, x[:200]); rt = None
          if rt:
            H = {'Authorization':'Bearer ' + rt, 'Accept':'application/json'}
            for u in ('https://api.linksynergy.com/v2/advertisers?limit=200', 'https://api.linksynergy.com/v1/partnerships?limit=200', 'https://api.linksynergy.com/advertisersearch/1.0'):
              s, x = get(u, H); print(u, s, len(x))
              if s != 200: print(x[:300]); continue
              nombres = re.findall(r'"name"\s*:\s*"([^"]+)"|<advertiserName>(.*?)</advertiserName>|"advertiser_name"\s*:\s*"([^"]+)"', x)
              ns = sorted({a or b or c for a, b, c in nombres})
              print('  total nombres', len(ns))
              for n in ns:
                if KW.search(n): print('  ', n)
              if 'partnerships' in u: print('  partnerships:', x[:1500])
          # ---------- Impact ----------
          print('\n########## IMPACT ##########')
          sid = E('IMPACT_ACCOUNT_SID')
          s, x = get(f'https://api.impact.com/Mediapartners/{sid}/Campaigns?PageSize=200', {'Authorization':'Basic ' + base64.b64encode((sid + ':' + E('IMPACT_AUTH_TOKEN')).encode()).decode(), 'Accept':'application/json'})
          print('Impact', s)
          try:
            for c in json.loads(x).get('Campaigns', []): print(f"  {c.get('ContractStatus','')} | {c.get('CampaignName','')} | {c.get('CampaignUrl','')}")
          except Exception: print(x[:300])
          PY
