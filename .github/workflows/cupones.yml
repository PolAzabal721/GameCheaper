name: Cupones de Admitad
# Cada día lee los cupones de las tiendas de Admitad y los deja en config/cupones-auto.json (la web los pone solos al publicarse)
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cupones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/cupones_admitad.mjs
        env:
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
      - name: Guardar
        run: |
          git config user.name "pillao-bot"; git config user.email "bot@pillaojuegos.com"
          git add config/cupones-auto.json
          git diff --cached --quiet && exit 0
          git commit -qm "Cupones de Admitad"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
