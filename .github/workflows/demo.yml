name: Demo

on:
  workflow_dispatch:

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Grabar la web
        run: |
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const c = await b.newContext({ viewport: { width: 1280, height: 720 }, recordVideo: { dir: "grab", size: { width: 1280, height: 720 } } });
            const p = await c.newPage();
            await p.goto("https://pillaojuegos.com/", { waitUntil: "load" });
            await p.waitForTimeout(3500);
            await p.mouse.wheel(0, 700); await p.waitForTimeout(2000);
            await p.mouse.wheel(0, 700); await p.waitForTimeout(2000);
            const caja = await p.$("input[type=search], input#q, input[type=text]");
            if (caja) { await caja.click(); for (const ch of "EVERSPACE 2") { await p.keyboard.type(ch); await p.waitForTimeout(120); } await p.waitForTimeout(3500); }
            await p.mouse.wheel(0, 500); await p.waitForTimeout(3000);
            await c.close(); await b.close();
          })()'
          ls -la grab
      - name: Juntarlo con el vídeo del chollo
        run: |
          WEB=$(ls grab/*.webm | head -1)
          CHOLLO=$(ls videos/*.mp4 | tail -1)
          ffmpeg -y -i "$WEB" -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,drawtext=text='pillaojuegos.com — de aqui salen los chollos':fontcolor=white:fontsize=28:box=1:boxcolor=0x1d1600@0.75:boxborderw=14:x=(w-text_w)/2:y=h-70" -an -c:v libx264 -pix_fmt yuv420p -crf 20 a.mp4
          ffmpeg -y -i "$CHOLLO" -vf "scale=405:720,pad=1280:720:(ow-iw)/2:0:black,fps=30,drawtext=text='el video que se subiria a TikTok':fontcolor=white:fontsize=28:box=1:boxcolor=0x1d1600@0.75:boxborderw=14:x=(w-text_w)/2:y=h-70" -an -c:v libx264 -pix_fmt yuv420p -crf 20 b.mp4
          printf "file 'a.mp4'\nfile 'b.mp4'\n" > lista.txt
          ffmpeg -y -f concat -safe 0 -i lista.txt -c copy demo-pillao.mp4
          ls -la demo-pillao.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: demo-pillao.mp4
